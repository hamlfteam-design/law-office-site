<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>بوابة محامي الطوارئ | HAMLF</title>
<link rel="manifest" href="lawyer.webmanifest">
<meta name="theme-color" content="#0B2A1F">
<link rel="icon" href="../logo.png">
<link rel="apple-touch-icon" href="../logo.png">
<style>
@font-face{font-family:"SF Sultan";src:url(../Sultan-Black.ttf) format("truetype")}
@font-face{font-family:"HBody";src:url(../Sultan-Black.ttf) format("truetype");unicode-range:U+0030-0039,U+0660-0669}
@font-face{font-family:"HBody";src:url(../SF-Mada-Bold.ttf) format("truetype")}
:root{--card:#fff;--line:#dfe3df;--muted:#5B6E63;--f-title:"SF Sultan",sans-serif;--brand:#0B6E4F}
*{box-sizing:border-box}
body{margin:0;background:#F7F6F1;color:#16261F;font-family:"HBody",sans-serif;font-weight:700}
header{background:#0B2A1F;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-family:"SF Sultan";font-size:16px}
header button{background:transparent;border:1px solid #C9A227;color:#C9A227;border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
main{max-width:720px;margin:14px auto;padding:0 12px}
h2{font-family:"SF Sultan";text-align:center;color:#0B2A1F}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--brand);font:inherit}
.tabs button.on{background:var(--brand);color:#fff}
.notice{background:#fbf6e6;border:1px dashed #C9A227;border-radius:10px;padding:10px;font-size:12.5px;line-height:1.8;margin-top:14px}
</style>
</head>
<body>
<header><b>بوابة محامي الطوارئ — HAMLF</b><button id="out" style="display:none">خروج</button></header>
<main id="app"></main>
<div style="max-width:720px;margin:0 auto 20px;padding:0 12px">
  <div class="notice">مرحلة البناء: البوابة لسه ما اتربطتش بقاعدة بيانات المكتب، فالبيانات هنا محفوظة على الجهاز ده بس، والدخول مؤقت برقم التليفون لحد ربط تسجيل الدخول. المحامي هنا ما يشوفش غير البلاغات المكلَّف بيها، وما عندوش أي وصول لقضايا المكتب أو موكليه.</div>
</div>
<script src="emergency-core.js?v=1"></script>
<script src="emergency-ui.js?v=1"></script>
<script>
(function () {
  "use strict";
  var EM = window.EM, UI = window.EMUI, ar = EM.ar, el = UI.el, btn = UI.btn, app = document.getElementById("app");
  var SKEY = "hamlf.emergency.portal.session", tab = "open";
  function db() { return EM.store.get(); }
  function meId() { try { return localStorage.getItem(SKEY) || ""; } catch (e) { return ""; } }
  function me() { return EM.lawyer(meId()); }
  function f(lbl, node) { var b = el("div", "em-f"); b.appendChild(el("label", "", lbl)); b.appendChild(node); return b; }
  function inp(type) { var i = el("input"); i.type = type || "text"; return i; }

  function login() {
    app.textContent = ""; document.getElementById("out").style.display = "none";
    app.appendChild(el("h2", "", "الدخول"));
    var box = el("div", "em-form"), ph = inp("tel"); ph.dir = "ltr";
    box.appendChild(f("رقم التليفون المسجّل", ph)); var st = el("div", "em-note"); box.appendChild(st);
    box.appendChild(btn("دخول", "", function () {
      var p = EM.la(ph.value).replace(/\D/g, "").slice(-10), L = db().lawyers.filter(function (l) { return l.kind === "oncall" && String(l.phone).replace(/\D/g, "").slice(-10) === p; })[0];
      if (!L) { st.textContent = "الرقم ده مش مسجّل. سجّل الأول."; return; }
      if (!L.active) { st.textContent = "حسابك لسه مستني تفعيل مدير المكتب، أو اتقفل."; return; }
      localStorage.setItem(SKEY, L.id); home();
    }));
    app.appendChild(box);
    app.appendChild(el("h2", "", "تسجيل محامي جديد"));
    var r = el("div", "em-form"), nm = inp(), tel = inp("tel"), em = inp("email"), card = inp(), reg = el("select");
    tel.dir = em.dir = "ltr"; ["القاهرة", "الجيزة"].forEach(function (x) { var o = el("option", "", x); o.value = x; reg.appendChild(o); });
    r.appendChild(f("الاسم بالكامل *", nm)); r.appendChild(f("رقم التليفون / واتساب *", tel)); r.appendChild(f("البريد الإلكتروني", em));
    r.appendChild(f("رقم كارنيه النقابة *", card)); r.appendChild(f("منطقة العمل", reg));
    var s2 = el("div", "em-note"); r.appendChild(s2);
    r.appendChild(btn("إرسال طلب التسجيل", "", function () {
      if (!nm.value.trim() || !tel.value.trim() || !card.value.trim()) { s2.textContent = "كمّل البيانات المعلَّمة بنجمة."; return; }
      db().lawyers.push({ id: EM.uid("oc"), name: nm.value.trim(), phone: EM.la(tel.value.trim()), email: em.value.trim(), unionCard: EM.la(card.value.trim()),
        region: reg.value, kind: "oncall", grade: "normal", active: false, registeredAt: Date.now() });
      EM.store.save(); s2.textContent = "اتسجّل طلبك. هتقدر تدخل أول ما مدير المكتب يفعّل حسابك.";
    }));
    app.appendChild(r);
  }

  function mine() { var id = meId(); return db().reports.filter(function (r) { return r.assignedLawyerId === id; }); }
  function open(r) {
    app.textContent = ""; app.appendChild(btn("→ رجوع", "sec", home));
    app.appendChild(UI.card(r));
    var by = (me() || {}).name, row = el("div", "em-row"), live = r.status !== "approved" && r.status !== "closed";
    if (live && !r.ackAt) row.appendChild(btn("✋ استلمت", "gold", function () { EM.ack(r, by); open(r); }));
    if (live && !r.initial) row.appendChild(btn("التقرير الأولي الفوري", "red", function () { show(UI.initialForm(r, by, function () { open(r); })); }));
    if (live && r.initial && !r.detailed) row.appendChild(btn("التقرير التفصيلي", "", function () { show(UI.detailedForm(r, by, function () { open(r); })); }));
    if (live && !r.initial) row.appendChild(btn("اعتذار عن التكليف", "sec", function () {
      if (confirm("تأكيد الاعتذار؟ بدل الاستعداد بيسقط عن الشهر.")) { EM.decline(r, meId(), by); open(r); } }));
    if (row.children.length) app.appendChild(row);
    if (r.familyPhone) { var a = el("a", "em-btn sec", "📞 الاتصال بالأهل"); a.href = "tel:" + r.familyPhone; a.style.cssText = "display:inline-flex;align-items:center;text-decoration:none;margin-top:8px"; app.appendChild(a); }
    if (r.initial || r.detailed) app.appendChild(UI.reportView(r));
    var p = r.pay || EM.calc(r), pv = el("div", "em-form"); pv.appendChild(el("h3", "", r.pay ? "مستحقاتك (معتمدة)" : "مستحقاتك المتوقعة"));
    pv.appendChild(el("div", "em-note", ar(p.total) + " جنيه" + (p.late ? " — اتسجّل تأخير" : ""))); app.appendChild(pv);
  }
  function show(n) { app.textContent = ""; app.appendChild(n); scrollTo(0, 0); }

  function home() {
    var L = me(); if (!L || !L.active) { localStorage.removeItem(SKEY); login(); return; }
    document.getElementById("out").style.display = "";
    app.textContent = ""; app.appendChild(el("h2", "", "أهلاً أ. " + L.name));
    var tabs = el("div", "tabs");
    [["open", "بلاغاتي المفتوحة"], ["all", "كل بلاغاتي"], ["pay", "مستحقاتي"]].forEach(function (t) {
      var b = btn(t[1], "", function () { tab = t[0]; home(); }); b.className = tab === t[0] ? "on" : ""; tabs.appendChild(b); });
    app.appendChild(tabs);
    if (tab === "pay") {
      var m = EM.monthKey(Date.now()), s = EM.statement(L.id, m), c = el("div", "em-form");
      c.appendChild(el("h3", "", "كشف الشهر " + ar(m.split("-").reverse().join("/"))));
      s.rows.forEach(function (x) { c.appendChild(el("div", "em-note", "بلاغ " + ar(x.r.ref) + " — " + EM.STAGES[x.r.stage] + " — " + ar(x.c.total) + " جنيه")); });
      c.appendChild(el("div", "", "المراحل " + ar(s.sum) + " + بدل الاستعداد " + ar(s.standby) + (s.standbyLost ? " (سقط)" : "") + " = " + ar(s.total)));
      c.appendChild(el("div", "em-note", "اتصرف " + ar(s.paid) + " · الباقي " + ar(s.due))); app.appendChild(c); return;
    }
    var rows = mine().filter(function (r) { return tab === "all" || (r.status !== "approved" && r.status !== "closed"); });
    if (!rows.length) app.appendChild(el("div", "em-note", "مفيش بلاغات مكلَّف بيها دلوقتي."));
    rows.forEach(function (r) { app.appendChild(UI.card(r, { onOpen: open })); });
  }
  document.getElementById("out").onclick = function () { localStorage.removeItem(SKEY); login(); };
  setInterval(function () { if (meId() && document.querySelector(".tabs")) home(); }, 30000);
  meId() ? home() : login();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("lawyer-sw.js").catch(function () { });
})();
</script>
</body>
</html>
