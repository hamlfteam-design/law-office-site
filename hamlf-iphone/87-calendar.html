<style>
  /* لوحة ألوان تقويم الجلسات والمواعيد */
  .agenda {
    --a-bg:#eae5da; --a-paper:#fffdf6; --a-ink:#1f2937; --a-muted:#6b7280;
    --a-line:#d8d2c4; --a-gold:#8a6d1f; --a-accent:#12433a; --a-hl:#fff8e1;
    --c-judg:#b3261e;   /* محجوزة للحكم */
    --c-exp:#7a5c14;    /* خبراء ومفردات */
    --c-first:#12433a;  /* أول جلسة */
    --c-plain:#3f6091;  /* مرافعة / عادي */
    --c-appt:#8a6d1f;   /* موعد */
  }
  .agenda .card { background:var(--a-paper); border-color:var(--a-line); }

  .cal-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .cal-head button { width:46px; height:46px; border:1px solid var(--a-line);
        border-radius:11px; background:transparent; color:var(--a-accent);
        font-size:20px; font-family:inherit; }
  .cal-head .m { flex:1; text-align:center; font-family:var(--f-title);
        font-size:18px; color:var(--a-accent); cursor:pointer;
        border-radius:9px; padding:4px 0; }
  .cal-head .m:active { background:var(--a-hl); }

  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .dow  { text-align:center; font-size:11px; color:var(--a-muted); padding:5px 0;
          font-family:var(--f-title); }
  .day  { position:relative; min-height:56px; border-radius:9px;
          border:1px solid var(--a-line); background:var(--a-paper);
          font-family:inherit; font-size:14px; color:var(--a-ink); padding-top:6px; }
  .day.out   { background:transparent; border-color:transparent; opacity:.35; }
  .day.today { border-color:var(--a-gold); border-width:2px; font-weight:700;
               background:var(--a-hl); }
  .day.sel   { background:var(--a-accent); color:#fff; font-weight:700;
               border-color:var(--a-accent); }
  .bars { position:absolute; bottom:5px; right:5px; left:5px;
          display:flex; gap:2px; height:4px; }
  .bars i { flex:1; border-radius:2px; display:block; }
  /* القاعدة ١٦: شريط أعلى كل يوم بألوان قضاياه (منظومة ألوان القضايا) */
  .cbar { position:absolute; top:3px; right:6px; left:6px; display:flex; gap:2px; height:3px; }
  .cbar i { flex:1; border-radius:2px; display:block; }
  .cnt  { position:absolute; top:5px; left:5px; font-size:9.5px;
          color:var(--a-muted); }
  .day.sel .cnt { color:#fff; }

  .legend { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px;
            font-size:11.5px; color:var(--a-muted); }
  .legend span { display:flex; align-items:center; gap:5px; }
  .legend i { width:11px; height:11px; border-radius:3px; display:block; }

  .kpi  { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px; }
  .kpi div{ flex:1 1 30%; background:var(--a-paper); border:1px solid var(--a-line);
            border-radius:11px; padding:11px 7px; text-align:center; }
  .kpi .n{ font-family:var(--f-title); font-size:20px; }
  .kpi .l{ font-size:11px; color:var(--a-muted); margin-top:3px; line-height:1.5; }

  .ev   { background:var(--a-paper); border:1px solid var(--a-line);
          border-radius:11px; padding:11px; margin-bottom:8px;
          border-right:4px solid var(--c-plain); }
  .ev.judg  { border-right-color:var(--c-judg); }
  .ev.exp   { border-right-color:var(--c-exp); }
  .ev.first { border-right-color:var(--c-first); }
  .ev.appt  { border-right-color:var(--c-appt); }
  .ev .src { font-size:11px; color:var(--a-muted); }
  .ev .t   { font-family:var(--f-title); font-size:14.5px; line-height:1.7;
             margin-top:3px; word-break:break-word; }
  .ev .d   { font-size:12.5px; color:var(--a-muted); margin-top:5px;
             line-height:1.9; word-break:break-word; white-space:pre-line; }
  .ev .tag { display:inline-block; font-size:11px; padding:2px 9px;
             border-radius:20px; margin-top:6px; background:var(--a-hl);
             color:var(--a-gold); }

  /* ═══ الدفتر — صفحتين متقابلتين بتتقلّب زي الأجندة الورق (تقويم الجلسات، القاعدة ٥٥–٥٦) ═══ */
  #book { perspective:2800px; perspective-origin:50% 42%; padding:4px 0 14px; }
  .bk   { position:relative; margin:0 auto; max-width:1000px; display:flex;
          filter:drop-shadow(0 18px 28px rgba(60,40,10,.28)); }
  .pg   { flex:1; min-height:520px; background:linear-gradient(180deg,#fffdf6,#fbf7ea);
          border:1px solid #ddd3b8; position:relative; padding:14px 18px 28px; overflow:hidden; }
  .pg.r { border-radius:12px 3px 3px 12px; }
  .pg.l { border-radius:3px 12px 12px 3px; }
  .pg.r::after, .pg.l::after { content:""; position:absolute; top:0; bottom:0; width:24px; pointer-events:none; }
  .pg.r::after { left:0;  background:linear-gradient(270deg,rgba(90,75,35,.22),transparent); }
  .pg.l::after { right:0; background:linear-gradient(90deg,rgba(90,75,35,.22),transparent); }
  .spine { width:16px; flex:none; border-top:1px solid #ddd3b8; border-bottom:1px solid #ddd3b8;
           background:linear-gradient(90deg,#c9bd9b,#a2977a 45%,#7e7458 50%,#a2977a 55%,#c9bd9b);
           box-shadow:inset 0 0 14px rgba(0,0,0,.4); }
  .flip { position:absolute; top:0; bottom:0; width:calc(50% - 8px); z-index:9; pointer-events:none;
          transform-style:preserve-3d; transition:transform .72s cubic-bezier(.36,.05,.24,1); opacity:0; }
  .flip.live { opacity:1; }
  .flip.R { right:0; transform-origin:left center; }
  .flip.L { left:0;  transform-origin:right center; }
  .flip.R.go { transform:rotateY(-176deg); }
  .flip.L.go { transform:rotateY(176deg); }
  .flip .face { position:absolute; inset:0; backface-visibility:hidden; overflow:hidden;
                background:linear-gradient(180deg,#fffdf6,#fbf7ea); border:1px solid #ddd3b8; padding:14px 18px; }
  .flip .face.b { transform:rotateY(180deg); }
  .flip .face::before { content:""; position:absolute; inset:0; pointer-events:none;
                        background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 42%); }
  .flip.L .face::before { background:linear-gradient(270deg,rgba(0,0,0,.18),transparent 42%); }
  .pg .ph2, .face .ph2 { border-bottom:2px solid var(--a-accent,#5b3a21); padding-bottom:7px; margin-bottom:10px; }
  .dayn { font-family:var(--f-title); font-size:24px; color:var(--a-accent,#5b3a21); line-height:1.35; }
  .greg { font-size:16px; color:var(--a-ink); }
  .hij  { font-size:13px; color:#8a7b52; margin-top:2px; }
  .bcnt { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 10px; }
  .bcnt span { background:#fff; border:1px solid #e0d7bd; border-radius:999px; padding:2px 10px;
               font-size:12px; white-space:nowrap; }
  .brows { display:flex; flex-direction:column; gap:6px; max-height:380px; overflow:auto; }
  .brow  { background:#fff; border:1px solid #e6dfc9; border-inline-start:5px solid var(--c-plain);
           border-radius:7px; padding:6px 9px; font-size:12.5px; line-height:1.75; text-align:right; }
  .brow.lnk { cursor:pointer; }
  .brow .mut { color:var(--a-muted); }
  .none2 { color:#a5966e; font-style:italic; padding:26px 0; text-align:center; }
  .pno   { position:absolute; bottom:7px; inset-inline:0; text-align:center; font-size:11px; color:#a89b73; }
  .bknav { display:flex; gap:8px; justify-content:center; align-items:center; margin:4px 0 10px; flex-wrap:wrap; }
</style>

<script>
/* تقويم شهري بقواعد تطبيق تقويم الجلسات: تلوين حسب قرار الجلسة، وإحصاء الشهر */
(function () {
  "use strict";

  var MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو",
                "يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
  var DOW = ["أحد","إثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];

  var HOLD  = /حكم|حجز|للحكم|للنطق/;
  var EXP   = /خبير|تقرير|مفوض|مفردات|أمانة/;
  var FIRST = /أول جلسة|اول جلسة|أول جلسه/;

  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  var sel = isoOf(now);

  function ar(n, p) {
    var s = String(n);
    if (p) while (s.length < p) s = "0" + s;
    return s.replace(/[0-9]/g, function (d) { return "٠١٢٣٤٥٦٧٨٩"[+d]; });
  }
  function isoOf(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
           "-" + String(d.getDate()).padStart(2, "0");
  }
  function el(t, css, txt) {
    var e = document.createElement(t);
    if (css) e.style.cssText = css;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function read(k, d) {
    try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; }
  }

  /* ---- كل الأحداث المؤرّخة، مصنّفة بلونها ---- */
  function events() {
    var out = [];

    read("proflawyer.agenda.cases.v1", []).forEach(function (c) {
      (c.sessions || []).forEach(function (ss) {
        if (!ss.date) return;
        /* القرار متخزّن بأكتر من اسم (result/decision، وسبب التأجيل for/reason) — بيتقروا كلهم */
        var _r = ss.raw || {};
        var dec = String(_r.result || _r.decision || _r["for"] || _r.reason || "");
        var _all = [_r.result, _r.decision, _r["for"], _r.reason].filter(Boolean).join(" ");
        var typ = String((ss.raw && ss.raw.type) || "");
        var kind = HOLD.test(_all) ? "judg" : EXP.test(_all) ? "exp"
                 : FIRST.test(_all) ? "first" : "plain";
        out.push({
          date: ss.date, kind: kind, caseId: c.id, _c: c, _s: ss,
          title: (c.caseNo ? "دعوى " + c.caseNo + (c.caseYear ? " لسنة " + c.caseYear : "") : "قضية") +
                 (c.courtName ? " — " + c.courtName : ""),
          src: "قضايا التقويم",
          tag: dec || typ || "",
          detail: [c.circuit ? "الدائرة: " + c.circuit : "",
                   c.clients ? "الموكل: " + c.clients : "",
                   c.opponents ? "الخصم: " + c.opponents : "",
                   c.hall ? "قاعة " + c.hall + (c.floor ? " — دور " + c.floor : "") : "",
                   c.time || ""].filter(Boolean).join("\n")
        });
      });
    });

    read("proflawyer.appointments.v1", []).forEach(function (a) {
      var d = window.lawyerToISO ? window.lawyerToISO(a.date) : a.date;
      if (!d) return;
      out.push({ date: d, kind: "appt", title: a.title, src: "المواعيد",
                 tag: a.kind || "", detail: [a.with ? "مع: " + a.with : "", a.notes || ""]
                 .filter(Boolean).join("\n"), time: a.time });
    });

    if (window.LawyerStore) {
      LawyerStore.all().forEach(function (r) {
        if (r.store === "agenda" || r.store === "appointments") return;
        r.dates.forEach(function (d) {
          out.push({ date: d, kind: "plain", title: r.title || r.values[0] || "سجل",
                     src: r.name, tag: "", detail: r.values.slice(0, 4).join("  ·  ") });
        });
      });
    }
    return out;
  }

  var EV = events();
  var caseStatus = {};
  read("proflawyer.agenda.cases.v1", []).forEach(function (c) { caseStatus[c.id] = c.status || ""; });
  var view = "month";
  function evList() {
    var hc = document.getElementById("hideEnded");
    if (!hc || !hc.checked) return EV;
    return EV.filter(function (e) { return !e.caseId || caseStatus[e.caseId] !== "منتهية"; });
  }

  function drawKPI() {
    var s = window.LawyerStats ? LawyerStats.compute() : null;
    var box = document.getElementById("kpi");
    box.textContent = "";
    if (!s) return;
    var pre = y + "-" + String(m + 1).padStart(2, "0");
    var monthEv = EV.filter(function (e) { return e.date.indexOf(pre) === 0; });
    var cnt = function (k) { return monthEv.filter(function (e) { return e.kind === k; }).length; };

    [[monthEv.length, "جلسة هذا الشهر", ""],
     [cnt("judg"),  "محجوزة للحكم", "var(--c-judg)"],
     [cnt("exp"),   "خبراء ومفردات", "var(--c-exp)"],
     [cnt("first"), "أول جلسة", "var(--c-first)"],
     [s.cases,      "قضية متداولة", ""],
     [s.apptsUpcoming, "موعد قادم", "var(--c-appt)"]
    ].forEach(function (p) {
      var d = el("div");
      var n = el("div", p[2] ? "color:" + p[2] : "", ar(p[0])); n.className = "n";
      d.appendChild(n);
      d.appendChild(el("div", "", p[1])).className = "l";
      box.appendChild(d);
    });
  }

  function drawMonth() {
    /* الشهر الهجري اللي بيغطي الشهر ده (أوله ← آخره) */
    var h1 = window.lawyerHijri ? lawyerHijri(new Date(y, m, 1), { month: true }) : "";
    var h2 = window.lawyerHijri ? lawyerHijri(new Date(y, m + 1, 0), { month: true }) : "";
    var hj = h1 ? (h1 === h2 ? h1 : h1.replace(/\s*\S+\s*هـ$/, "") + " – " + h2) : "";
    document.getElementById("mtitle").textContent = MONTHS[m] + "  " + ar(y);
    if (hj) {
      var hs = document.createElement("div");
      hs.style.cssText = "font-size:12px;color:var(--muted);font-family:inherit;margin-top:1px";
      hs.textContent = hj;
      document.getElementById("mtitle").appendChild(hs);
    }
    var pre = y + "-" + String(m + 1).padStart(2, "0");
    var byDay = {};
    evList().forEach(function (e) {
      if (e.date.indexOf(pre) !== 0) return;
      (byDay[e.date] = byDay[e.date] || []).push(e);
    });

    var grid = document.getElementById("grid");
    grid.textContent = "";
    var first = (new Date(y, m, 1).getDay() + 1) % 7;   /* السبت أول الأسبوع */
    var days  = new Date(y, m + 1, 0).getDate();
    var todayIso = isoOf(new Date());

    for (var i = 0; i < first; i++) {
      var e0 = el("div"); e0.className = "day out"; grid.appendChild(e0);
    }

    for (var d = 1; d <= days; d++) {
      (function (d) {
        var key = pre + "-" + String(d).padStart(2, "0");
        var list = byDay[key] || [];
        var b = document.createElement("button");
        b.type = "button";
        b.className = "day" + (key === todayIso ? " today" : "") + (key === sel ? " sel" : "");
        b.appendChild(document.createTextNode(ar(d)));

        if (list.length) {
          var kinds = {};
          list.forEach(function (e) { kinds[e.kind] = 1; });
          var bars = el("div"); bars.className = "bars";
          ["judg", "exp", "first", "plain", "appt"].forEach(function (k) {
            if (!kinds[k]) return;
            var i2 = document.createElement("i");
            i2.style.background = "var(--c-" + k + ")";
            bars.appendChild(i2);
          });
          b.appendChild(bars);
          if (window.CaseFile && CaseFile.caseColor) {
            var ks = {}, order = ["grey", "yellow", "red", "green", "orange", "purple", "cyan", "pink", "blue"];
            list.forEach(function (e) { if (e._c) ks[CaseFile.caseColor(e._c).k] = 1; });
            var cb = el("div"); cb.className = "cbar";
            order.forEach(function (k) {
              if (!ks[k]) return;
              var ci = document.createElement("i"); ci.style.background = CaseFile.CASE_COLORS[k].hex;
              ci.title = CaseFile.CASE_COLORS[k].name; cb.appendChild(ci);
            });
            if (cb.children.length) b.appendChild(cb);
          }
          var c = el("span", "", ar(list.length)); c.className = "cnt";
          b.appendChild(c);
        }

    else drawYear();
  }

  document.getElementById("vMonth").onclick = function () { view = "month"; setViewBtns(); draw(); };
  document.getElementById("vWeek").onclick = function () { view = "week"; setViewBtns(); draw(); };
  document.getElementById("vYear").onclick = function () { view = "year"; setViewBtns(); draw(); };
  document.getElementById("vBook").onclick = function () { view = "book"; setViewBtns(); draw(); };
  syncBookBtn();
  document.getElementById("hideEnded").onclick = function () { draw(); showDay(); };
  document.getElementById("printCal").onclick = function () {
    if (window.AndroidSaver && AndroidSaver.printPage) AndroidSaver.printPage("تقويم — " + document.getElementById("mtitle").textContent);
    else window.print();
  };

  document.getElementById("prev").onclick = function () {
    if (view === "book") { bookFlip(1); return; }
    if (view === "year") { y++; }
    else if (view === "week") { var d = selDate(); d.setDate(d.getDate() + 7); sel = isoOf(d); y = d.getFullYear(); m = d.getMonth(); }
    else { m++; if (m > 11) { m = 0; y++; } }
    draw();
  };
  document.getElementById("next").onclick = function () {
    if (view === "book") { bookFlip(-1); return; }
    if (view === "year") { y--; }
    else if (view === "week") { var d = selDate(); d.setDate(d.getDate() - 7); sel = isoOf(d); y = d.getFullYear(); m = d.getMonth(); }
    else { m--; if (m < 0) { m = 11; y--; } }
    draw();
  };
  document.getElementById("today").onclick = function () {
    var n = new Date(); y = n.getFullYear(); m = n.getMonth(); sel = isoOf(n);
    draw(); showDay();
  };

  var mc = document.getElementById("mergeCal");
  if (mc) mc.onclick = function () {
    if (!window.AgendaImport || !AgendaImport.mergePreview) return;
    var pv = AgendaImport.mergePreview();
    if (!pv.count) { alert("لا مواعيد تقويم غير مدمجة — كلها ممثَّلة بقضايا بالفعل."); return; }
    var NL = String.fromCharCode(10);
    Ask.confirm("دمج مواعيد التقويم كقضايا؟", {
      ok: "دمج (" + pv.count + ")",
      detail: "سيُنشأ " + pv.count + " ملف قضية من مواعيد التقويم غير المرتبطة بقضايا." + NL +
        "الحقول توضَع فيما يناسبها (الموضوع/الموكل/الجلسة)، ولا تُمسّ القضايا القائمة." + NL + NL +
        pv.examples.map(function (x) { return "• " + x; }).join(NL) + (pv.count > 6 ? NL + "…" : "")
    }, function () {
      var r = AgendaImport.mergeAppts();
      if (!r.ok) { alert("تعذّر الحفظ."); return; }
      alert("تم الدمج — أُضيف " + r.added + " ملف قضية.");
      location.href = "90-case-file.html";
    });
  };

  var dows = document.getElementById("dows");
  [6,0,1,2,3,4,5].forEach(function (i) {
    var d = el("div", "", DOW[i]); d.className = "dow"; dows.appendChild(d);
  });

  draw();
  /* case-file.js (ألوان القضايا) بيتحمّل بعد السكربت ده — ارسم تاني لما يوصل */
  window.addEventListener("load", function () { if (window.CaseFile && CaseFile.caseColor) draw(); });
  showDay();
})();
</script>
