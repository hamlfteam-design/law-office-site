<script>
/* تعبئة قائمة القضايا من السجلات المحفوظة في صفحة القضايا */
(function () {
  var sel = document.getElementById("xCase");
  if (!sel) return;
  var db;
  try { db = JSON.parse(localStorage.getItem("proflawyer.screens.v1")) || {}; }
  catch (e) { db = {}; }
  var recs = db["01-cases"] || [];
  recs.forEach(function (r) {
    var vals = (r.v || []).map(function (c) { return c && c.x; }).filter(Boolean);
    var o = document.createElement("option");
    o.value = r._id;
    o.textContent = "ملف " + (vals[0] || "؟") + (vals[3] ? " — " + vals[3] : "");
    sel.appendChild(o);
  });
  if (!recs.length) {
    var o = document.createElement("option");
    o.disabled = true;
    o.textContent = "لا توجد قضايا محفوظة بعد — سجّل قضية أولاً";
    sel.appendChild(o);
  }
})();
</script>
