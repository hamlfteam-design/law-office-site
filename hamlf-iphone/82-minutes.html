  .kpi  { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px; }
  .kpi div{ flex:1 1 30%; background:var(--card); border:1px solid var(--line);
            border-radius:11px; padding:11px 7px; text-align:center; }

  .kpi .l{ font-size:11px; color:var(--muted); margin-top:3px; }
  .mn   { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:12px; margin-bottom:9px; }
  .mn .hd { display:flex; gap:8px; align-items:flex-start; }
  .mn .no { flex:0 0 auto; background:var(--brand); color:#fff; border-radius:8px;

  .mn .ttl{ flex:1; font-family:var(--f-title); font-size:15px; line-height:1.7;

  .mn .kind { flex:0 0 auto; font-size:11px; padding:2px 9px; border-radius:20px;
            background:#efe7db; color:#5b3a21; }
  .mn .r  { display:flex; gap:8px; font-size:12.5px; color:var(--muted);
            margin-top:6px; line-height:1.9; }
  .mn .r b{ flex:0 0 88px; color:var(--brand-dark); font-family:var(--f-title);
            font-weight:400; }
  .mn .r span{ flex:1; word-break:break-word; }
  .mn .act{ display:flex; gap:7px; margin-top:10px; flex-wrap:wrap; }
  .mn .act button { flex:1 1 auto; min-width:78px; min-height:42px;
          border:1px solid var(--line); border-radius:8px; background:transparent;
          color:var(--brand); font-family:inherit; font-size:12.5px; }
  .mn .st { margin-top:8px; padding:8px 10px; border-radius:9px;
            background:var(--bg,#f4ece0); font-size:12.5px; line-height:1.9; }
  .mn .nt { margin-top:7px; padding-top:7px; border-top:1px dashed var(--line);
            font-size:12.5px; color:var(--muted); line-height:1.9;
            white-space:pre-line; }
  .tabs2 { display:flex; gap:7px; margin-bottom:12px; }
  .tabs2 button { flex:1; min-height:46px; border-radius:10px; font-family:inherit;
        font-size:14px; border:1px solid var(--line); background:transparent;
        color:var(--brand); }
  .tabs2 button.on { background:var(--brand); color:#fff; border-color:var(--brand); }
</style>

<script>
(function () {
  "use strict";

  var mode = "all";
  var ar = Minutes.ar;

  function el(t, css, txt) {
    var e = document.createElement(t);
    if (css) e.style.cssText = css;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function drawKpi() {
    var all = Minutes.all();
    var open = 0, keep = 0, gr = 0, ses = 0;
    all.forEach(function (m) {
      if (!m.action) open++;
      else if (m.action === "حفظ") keep++;
      else if (m.action === "تظلم") gr++;
      else if (m.action === "جلسة") ses++;
    });
    var box = document.getElementById("kpi");
    box.textContent = "";
    [[all.length, "محضر"], [open, "بلا تصرف"], [ses, "أُحيل لجلسة"],
     [keep, "محفوظ"], [gr, "متظلَّم فيه"]].forEach(function (p) {
      var d = el("div");
      d.appendChild(el("div", "", ar(p[0]))).className = "n";
      d.appendChild(el("div", "", p[1])).className = "l";
      box.appendChild(d);
    });
  }

  function row(label, value) {
    var r = el("div"); r.className = "r";
    r.appendChild(el("b", "", label));
    r.appendChild(el("span", "", value));
    return r;
  }

  function draw() {
    var q = document.getElementById("q").value.trim();
    var list = Minutes.search(q);

    if (mode === "open") list = list.filter(function (m) { return !m.action; });
    if (mode === "keep") list = list.filter(function (m) { return m.action === "حفظ"; });
    if (mode === "gr")   list = list.filter(function (m) { return m.action === "تظلم"; });

    document.getElementById("stat").textContent =
      list.length ? "المعروض: " + ar(list.length)
                  : (q ? "لا يوجد محضر يطابق «" + q + "»"
                       : "لا محاضر مسجَّلة — اضغط «محضر جديد».");

    var box = document.getElementById("list");
    box.textContent = "";

    list.forEach(function (m) {
      var card = el("div"); card.className = "mn";

      var hd = el("div"); hd.className = "hd";
      hd.appendChild(el("span", "", m.no ? ar(m.no) : "—")).className = "no";
      hd.appendChild(el("span", "",
        (m.year ? "لسنة " + ar(m.year) : "بلا سنة") +
        (m.station ? " — " + m.station : ""))).className = "ttl";
      if (m.kind) hd.appendChild(el("span", "", m.kind)).className = "kind";
      card.appendChild(hd);

      if (m.client)  card.appendChild(row("الموكل", m.client + (m.role ? " — " + m.role : "")));
      if (m.subject) card.appendChild(row("الموضوع", m.subject));
      if (m.date)    card.appendChild(row("تاريخ التحرير", ar(m.date)));
      if (m.pros || m.prosNo) {
        card.appendChild(row("النيابة",
          [m.pros, m.prosNo ? "قيد " + ar(m.prosNo) +
           (m.prosYear ? " لسنة " + ar(m.prosYear) : "") : ""]
          .filter(Boolean).join(" — ")));
      }

      /* التصرف */
      var st = el("div"); st.className = "st";
      if (!m.action) {
        st.appendChild(el("span", "color:#b3261e", "لم يُسجَّل التصرف فيه بعد."));
      } else if (m.action === "جلسة") {
        st.appendChild(el("div", "font-family:var(--f-title);color:var(--brand-dark)",
          "أُحيل إلى جلسة" + (m.hearingDate ? " — " + ar(m.hearingDate) : "")));
        st.appendChild(el("div", "",
          m.caseFileNo ? "ملف بالمكتب رقم " + ar(m.caseFileNo)
                       : "لم يُحدَّد رقم الملف بالمكتب."));
        if (m.caseId) st.appendChild(el("div", "color:#1f7a4d", "رُحِّل إلى سجل القضايا ✓"));
      } else if (m.action === "حفظ") {
        st.appendChild(el("div", "font-family:var(--f-title);color:var(--brand-dark)",
          "حُفظ" + (m.keepDate ? " في " + ar(m.keepDate) : "")));
        if (m.keepReason) st.appendChild(el("div", "", "السبب: " + m.keepReason));
      } else if (m.action === "تظلم") {
        st.appendChild(el("div", "font-family:var(--f-title);color:var(--brand-dark)",
          "تظلُّم" + (m.grNo ? " رقم " + ar(m.grNo) : "") +
          (m.grDate ? " — " + ar(m.grDate) : "")));
        if (m.grBody) st.appendChild(el("div", "", "الجهة: " + m.grBody));
        if (m.grKind) st.appendChild(el("div", "", "نوعه: " + m.grKind));
        if (m.grKind === "عرائض إلكترونية") {
          st.appendChild(el("div", "",
            "العريضة " + ar(m.epNo || "—") +
            (m.epDate ? " — قُدِّمت في " + ar(m.epDate) : "")));
          if (m.epResult) st.appendChild(el("div", "white-space:pre-line",
            "ما تم فيها: " + m.epResult));
        }
      }
      card.appendChild(st);

      /* الملاحظات */
      if (m.notes && m.notes.length) {
        var nt = el("div"); nt.className = "nt";
        nt.textContent = m.notes.map(function (n) {
          return "▪ " + Minutes.arDate(n.at) + " — " + n.body;
        }).join("\n");
        card.appendChild(nt);
      }

      /* الأزرار */
      var act = el("div"); act.className = "act";
      function b(label, on) {
        var x = document.createElement("button");
        x.type = "button"; x.textContent = label; x.onclick = on;
        act.appendChild(x);
        return x;
      }
      b("✎ تعديل", function () {
        Minutes.edit(m.id, function () { drawKpi(); draw(); });
      });
      b("＋ ملاحظة", function () {
        Minutes.addNote(m.id, function () { draw(); });
      });
      if (m.action === "جلسة" && !m.caseId) {
        var t = b("↪ ترحيل للقضايا", function () {
          Minutes.toCase(m.id, function () { drawKpi(); draw(); });
        });
        t.style.borderColor = "var(--brand)";
        t.style.fontWeight = "600";
      }
      var d = b("🗑 حذف", function () {
        Minutes.remove(m.id, function () { drawKpi(); draw(); });
      });
      d.style.color = "#b3261e";
      d.style.borderColor = "#e3c9c6";
      card.appendChild(act);

      box.appendChild(card);
    });
  }

  var timer;
  document.getElementById("q").addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(draw, 160);
  });

  document.querySelectorAll(".tabs2 button").forEach(function (b) {
    b.onclick = function () {
      mode = b.getAttribute("data-mode");
      document.querySelectorAll(".tabs2 button").forEach(function (x) {
        x.classList.remove("on");
      });
      b.classList.add("on");
      draw();
    };
  });

  document.getElementById("add").onclick = function () {
    Minutes.edit(null, function () { drawKpi(); draw(); });
  };

  drawKpi();
  draw();
})();
</script>
