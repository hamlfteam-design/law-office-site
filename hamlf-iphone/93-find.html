<script>
(function () {
  "use strict";

  var ar = FindAll.ar;
  var kindFilter = "";

  function el(t, css, txt) {
    var e = document.createElement(t);
    if (css) e.style.cssText = css;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function results() {
    var list = FindAll.search(document.getElementById("q").value);
    return kindFilter ? list.filter(function (r) { return r.kind === kindFilter; }) : list;
  }

  function drawChips(all) {
    var box = document.getElementById("chips");
    box.textContent = "";
    if (!all.length) return;

    var counts = {};
    all.forEach(function (r) { counts[r.kind] = (counts[r.kind] || 0) + 1; });

    function chip(label, key) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = label;
      if (key === kindFilter) b.className = "on";
      b.onclick = function () { kindFilter = key; draw(); };
      box.appendChild(b);
    }
    chip("الكل " + ar(all.length), "");
    Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; })
      .forEach(function (k) { chip(k + " " + ar(counts[k]), k); });
  }

  function draw() {
    var q = document.getElementById("q").value.trim();
    var all = q ? FindAll.search(q) : [];
    drawChips(all);

    var list = kindFilter
      ? all.filter(function (r) { return r.kind === kindFilter; })
      : all;

    document.getElementById("stat").textContent = !q
      ? "اكتب أي قيمة لتبدأ."
      : (list.length ? "النتائج: " + ar(list.length)
                     : "لا يوجد ما يطابق «" + q + "» في أي سجل.");

    var box = document.getElementById("list");
    box.textContent = "";

    list.slice(0, 150).forEach(function (r) {
      var card = el("div"); card.className = "fr";

      var hd = el("div"); hd.className = "hd";
      hd.appendChild(el("span", "", r.icon || "•")).className = "ic";
      hd.appendChild(el("span", "", r.title)).className = "ttl";
      hd.appendChild(el("span", "", r.kind)).className = "kd";
      card.appendChild(hd);

      if (r.lines && r.lines.length) {
        card.appendChild(el("div", "", r.lines.join("\n"))).className = "ln";
      }

      var act = el("div"); act.className = "act";
      function b(label, on, css) {
        var x = document.createElement("button");
        x.type = "button"; x.textContent = label; x.onclick = on;
        if (css) x.style.cssText += css;
        act.appendChild(x);
        return x;
      }

      b("✎ تعديل", function () { r.edit(draw); });

      if (r.appt) {
        b("↪ اجعله جلسة", function () {
          FindAll.toSession(r.id, draw);
        }, "border-color:var(--brand);font-weight:600");
      }

      b("🗑 حذف", function () {
        Ask.confirm("حذف هذا السجل نهائياً؟",
                    { detail: r.kind + " — " + r.title, ok: "حذف" },
                    function () { r.remove(draw); });
      }, "color:#b3261e;border-color:#e3c9c6");

      card.appendChild(act);
      box.appendChild(card);
    });

    if (list.length > 150) {
      box.appendChild(el("div",
        "padding:12px;color:var(--muted);font-size:12.5px;text-align:center",
        "…و" + ar(list.length - 150) + " نتيجة — ضيّق البحث"));
    }
  }

  var timer;
  document.getElementById("q").addEventListener("input", function () {
    clearTimeout(timer);
    kindFilter = "";
    timer = setTimeout(draw, 180);
  });

  document.getElementById("addCase").onclick = function () {
    CaseFile.editCase({}, function (rec) { CaseFile.openCase(rec.id, draw); }, { source: "registry" });
  };
  document.getElementById("addReg").onclick = function () {
    location.href = "92-register.html";
  };
  document.getElementById("addCli").onclick = function () {
    ClientsPOA.addClient(function () { draw(); });
  };

  var m = location.search.match(/[?&]q=([^&]*)/);
  if (m) document.getElementById("q").value = decodeURIComponent(m[1]);

  draw();
})();
</script>
