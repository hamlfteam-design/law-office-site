<script>
(function () {
  "use strict";

  var R = Registers;
  var ar = R.ar;
  var keys = Object.keys(window.REGS);
  var cur = keys[0];

  /* ?reg=mahader يفتح سجلاً بعينه */
  var m = location.search.match(/[?&]reg=([^&]*)/);
  if (m && window.REGS[decodeURIComponent(m[1])]) cur = decodeURIComponent(m[1]);

  function el(t, css, txt) {
    var e = document.createElement(t);
    if (css) e.style.cssText = css;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function drawPicks() {
    var box = document.getElementById("picks");
    box.textContent = "";
    keys.forEach(function (k) {
      var reg = window.REGS[k];
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = reg.i + " " + reg.n.replace(/^سجل\s*(متابعة\s*)?/, "");
      if (k === cur) b.className = "on";
      b.onclick = function () {
        cur = k;
        document.getElementById("q").value = "";
        drawPicks(); drawMoney(); draw();
      };
      box.appendChild(b);
    });
    document.getElementById("ttl").textContent = window.REGS[cur].n;
    document.getElementById("syncExperts").hidden = (cur !== "khubara");
    document.getElementById("waraqAdmin").hidden = (cur !== "waraq");
  }

  function current() {
    return R.search(cur, document.getElementById("q").value.trim());
  }

  /* المصاريف وحدها لها العهدة والمنصرف والرصيد — كلٌّ في خانته */
  function drawMoney() {
    var box = document.getElementById("money");
    if (!window.REGS[cur].exp) { box.hidden = true; return; }
    box.hidden = false;
    var t = R.expenseTotals(current());
    box.textContent = "";
    [["العهدة", t.custody, "cu"], ["المنصرف", t.spent, "sp"], ["الرصيد", t.balance, "ba"]]
      .forEach(function (p) {
        var d = el("div");
        d.className = p[2];
        d.appendChild(el("div", "", p[0])).className = "l";
        d.appendChild(el("div", "", R.fmtMoney(p[1]))).className = "n";
        box.appendChild(d);
      });
  }

  function draw() {
    var reg = window.REGS[cur];
    var list = current();

    document.getElementById("stat").textContent =
      list.length ? "المعروض: " + ar(list.length) + " قيد"
                  : "لا قيود في هذا السجل — اضغط «قيد جديد».";

    var box = document.getElementById("list");
    box.textContent = "";

    list.forEach(function (r) {
      var card = el("div"); card.className = "rg";

      /* أول ثلاثة حقول عنواناً، والباقي أسطراً — والفارغ لا يُعرض.
         كل جزء داخل bdi حتى لا تُقلب الأرقام العربية ترتيبها بخوارزمية
         الاتجاه فتبدو كأنها من الشمال لليمين. */
      var t1el = el("div"); t1el.className = "t1";
      var segs = reg.F.slice(0, 3).map(function (f) {
        return r[f.k] ? ar(r[f.k]) : "";
      }).filter(Boolean);
      if (!segs.length) {
        t1el.textContent = "قيد بلا بيان";
      } else {
        segs.forEach(function (sgv, i) {
          if (i) t1el.appendChild(el("span", "", " · ")).className = "sep";
          var bd = document.createElement("bdi");
          bd.textContent = sgv;
          t1el.appendChild(bd);
        });
      }
      card.appendChild(t1el);

      reg.F.slice(3).forEach(function (f) {
        if (f.act) return;
        var v = f.calc
          ? R.fmtMoney(R.money(r.custody) - R.money(r.amount))
          : r[f.k];
        if (!v) return;
        var row = el("div"); row.className = "r";
        row.appendChild(el("b", "", f.t));
        row.appendChild(el("span", "", ar(v)));
        card.appendChild(row);
      });

      var act = el("div"); act.className = "act";
      function b(label, on) {
        var x = document.createElement("button");
        x.type = "button"; x.textContent = label; x.onclick = on;
        act.appendChild(x);
        return x;
      }
      b("✎ تعديل", function () {
        R.edit(cur, r._id, function () { drawMoney(); draw(); });
      });
      if (cur === "waraq" && R.shareWaraq) {
        var sw = b("🟢 إرسال لفريق المحضرين", function () { R.shareWaraq(r, sw); });
        sw.style.color = "#128c3e"; sw.style.borderColor = "#25d366";
        var dl = b("⬇ تنزيل البطاقة", function () { R.downloadWaraq(r, dl); });
      }
      var d = b("🗑 حذف", function () {
        R.remove(cur, r._id, function () { drawMoney(); draw(); });
      });
      d.style.color = "#b3261e";
      d.style.borderColor = "#e3c9c6";
      card.appendChild(act);

      box.appendChild(card);
    });
  }

  var timer;
  document.getElementById("q").addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () { drawMoney(); draw(); }, 160);
  });

  document.getElementById("add").onclick = function () {
    R.edit(cur, null, function () { drawMoney(); draw(); });
  };
  document.getElementById("print").onclick = function () {
    R.print(cur, current());
  };
  document.getElementById("syncExperts").onclick = function () {
    if (!R.syncExpertsFromCases) { alert("المزامنة غير متاحة في هذه النسخة."); return; }
    var r = R.syncExpertsFromCases();
    if (!r.matched) {
      alert("لم يُعثر على قضايا تحتوي «خبير» أو «لورود التقرير».");
      return;
    }
    alert("تمّت المزامنة — " + ar(r.matched) + " قضية مطابقة" +
      (r.added ? "، أُضيف منها " + ar(r.added) + " قيد جديد" : "") +
      (r.updated ? "، وتحدَّث " + ar(r.updated) + " قيد قائم" : "") +
      (!r.added && !r.updated ? " — كل القيود محدَّثة بالفعل." : "."));
    drawMoney(); draw();
  };

  /* القيود القديمة (قبل التنزيل التلقائي): اللي لسه ما اتستلمتش بس، بعد تأكيد */
  document.getElementById("waraqAdmin").onclick = function () {
    if (!R.waraqToAdmin || !window.CaseFile) { alert("غير متاح في هذه النسخة."); return; }
    var open = R.rows("waraq").filter(function (r) {
      return !String(r.received || "").trim() && !/^تم/.test(String(r.done || "").trim());
    });
    if (!open.length) { alert("كل أوراق المحضرين مستلمة — مفيش حاجة تنزل."); return; }
    Ask.confirm("تنزيل " + ar(open.length) + " ورقة في «الأعمال الإدارية»؟", {
      danger: false, ok: "تنزيل (" + ar(open.length) + ")",
      detail: "كل ورقة بتنزل مهمة في قضيتها برقم الملف (أو التكليفات العامة لو مالهاش قضية)، " +
              "واللي نزلت قبل كده بتتحدّث بس من غير تكرار."
    }, function () {
      var n = 0;
      open.forEach(function (r) { if (R.waraqToAdmin(r)) n++; });
      if (window.PL && PL.toast) PL.toast("تم", "نزلت " + ar(n) + " ورقة في الأعمال الإدارية.", "ok");
    });
  };

  /* تعديل من جهاز تاني في الفريق (المدير مثلاً) وصل من السحابة ← يبان على طول ومكان الشاشة ثابت */
  window.addEventListener("regs:synced", function (e) {
    var y = window.scrollY || 0;
    drawMoney(); draw();
    window.scrollTo(0, y);
    if (window.PL && PL.toast) PL.toast("اتحدّثت السجلات", "وصل " + ar((e.detail && e.detail.n) || 1) + " تعديل من الفريق.", "ok");
  });
  /* أول ما الشاشة تتفتح: هات الجديد على طول من غير ما تستنى الدقيقة */
  setTimeout(function () { if (R.pull) R.pull(); }, 1200);

  drawPicks();
  drawMoney();
  draw();
})();
</script>
