<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قضاياي | بوابة الموكلين</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  .dash-wrap{max-width:900px;margin:0 auto;padding:40px 20px 80px;}
  .dash-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
  .dash-head h1{font-size:1.4rem;color:var(--navy);}
  .dash-head .who{color:var(--muted);font-size:.9rem;}
  .btn-logout{background:none;border:1px solid #d8d4cb;border-radius:999px;padding:8px 18px;cursor:pointer;font-family:inherit;font-size:.85rem;color:var(--muted);}
  .case-card{background:var(--white);border:1px solid #e7e4dd;border-radius:var(--radius);padding:22px;margin-bottom:16px;}
  .case-card h3{color:var(--navy);margin-bottom:6px;}
  .case-meta{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;font-size:.85rem;color:var(--muted);}
  .case-meta span{background:var(--bg);border-radius:6px;padding:4px 10px;}
  .session-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #f0eee8;font-size:.9rem;}
  .session-row:first-of-type{border-top:none;}
  .session-date{font-weight:700;color:var(--navy);}
  .pdf-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .pdf-list a{background:var(--bg);border:1px solid #e7e4dd;border-radius:6px;padding:6px 12px;font-size:.82rem;color:var(--navy);}
  .empty-state{text-align:center;color:var(--muted);padding:60px 20px;}
  .loading{text-align:center;color:var(--muted);padding:60px 20px;}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <a href="../index.html#home"><img src="../assets/images/logo.png" alt="شعار مؤسسة د. حسن عبد المنعم حسن" class="brand-logo"></a>
    </div>
  </div>
</header>

<div class="dash-wrap">
  <div class="dash-head">
    <div>
      <h1>قضاياي</h1>
      <p class="who" id="whoText"></p>
    </div>
    <button class="btn-logout" id="logoutBtn">تسجيل الخروج</button>
  </div>

  <div id="content">
    <div class="loading">جارٍ تحميل بياناتك…</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, query, where, getDocs, orderBy
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { firebaseConfig, COLLECTIONS } from "./portal-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const contentEl = document.getElementById("content");
  const whoText = document.getElementById("whoText");

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "index.html";
  });

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }
    whoText.textContent = user.email;

    try {
      // ملحوظة تنفيذية: الاستعلام هنا بيفترض إن كل وثيقة قضية في
      // كولكشن "cases" فيها حقل clientEmail بنفس إيميل الموكل.
      // لو شكل البيانات الفعلي في Firestore مختلف (مثلاً clientId
      // بدل clientEmail)، الاستعلام ده هيتعدّل بسهولة بعد ما نتأكد
      // من الـ schema الحقيقي.
      const casesQuery = query(
        collection(db, COLLECTIONS.cases),
        where("clientEmail", "==", user.email)
      );
      const casesSnap = await getDocs(casesQuery);

      if (casesSnap.empty) {
        contentEl.innerHTML = `<div class="empty-state">مفيش قضايا مسجّلة على إيميلك حالياً. لو ده غير متوقع، تواصل معانا.</div>`;
        return;
      }

      let html = "";
      for (const caseDoc of casesSnap.docs) {
        const c = caseDoc.data();
        html += `
          <div class="case-card">
            <h3>${c.title || "قضية بدون عنوان"}</h3>
            <div class="case-meta">
              ${c.caseNumber ? `<span>رقم القضية: ${c.caseNumber}</span>` : ""}
              ${c.court ? `<span>المحكمة: ${c.court}</span>` : ""}
              ${c.status ? `<span>الحالة: ${c.status}</span>` : ""}
            </div>
            <div id="sessions-${caseDoc.id}"></div>
            <div id="pdfs-${caseDoc.id}" class="pdf-list"></div>
          </div>
        `;
      }
      contentEl.innerHTML = html;

      // تحميل الجلسات والمستندات لكل قضية
      for (const caseDoc of casesSnap.docs) {
        const sessionsQuery = query(
          collection(db, COLLECTIONS.sessions),
          where("caseId", "==", caseDoc.id),
          orderBy("date", "asc")
        );
        try {
          const sessionsSnap = await getDocs(sessionsQuery);
          const sessionsEl = document.getElementById(`sessions-${caseDoc.id}`);
          if (!sessionsSnap.empty) {
            let rows = "";
            sessionsSnap.forEach(sDoc => {
              const s = sDoc.data();
              rows += `<div class="session-row"><span class="session-date">${s.date || ""}</span><span>${s.note || "جلسة"}</span></div>`;
            });
            sessionsEl.innerHTML = rows;
          }
        } catch (e) { /* كولكشن الجلسات لسه ما اتظبطش — تجاهل مؤقتاً */ }

        const c = caseDoc.data();
        if (Array.isArray(c.pdfs) && c.pdfs.length) {
          const pdfsEl = document.getElementById(`pdfs-${caseDoc.id}`);
          pdfsEl.innerHTML = c.pdfs.map(p => `<a href="${p.url}" target="_blank" rel="noopener">📄 ${p.name || "مستند"}</a>`).join("");
        }
      }
    } catch (err) {
      contentEl.innerHTML = `<div class="empty-state">حصل خطأ في تحميل البيانات. حاول تاني لاحقاً.</div>`;
      console.error(err);
    }
  });
</script>
</body>
</html>
