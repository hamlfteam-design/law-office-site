<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قضاياي | بوابة الموكلين</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  .dash-wrap{max-width:900px;margin:0 auto;padding:40px 20px 80px;}
  .dash-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
  .dash-head h1{font-size:1.4rem;color:var(--navy);}
  .dash-head .who{color:var(--muted);font-size:.9rem;}
  .btn-logout{background:none;border:1px solid #d8d4cb;border-radius:999px;padding:8px 18px;cursor:pointer;font-family:inherit;font-size:.85rem;color:var(--muted);}
  .case-card{background:var(--white);border:1px solid #e7e4dd;border-radius:var(--radius);padding:22px;margin-bottom:16px;}
  .case-card h3{color:var(--navy);margin-bottom:6px;}
  .case-meta{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;font-size:.85rem;color:var(--muted);}
  .case-meta span{background:var(--bg);border-radius:6px;padding:4px 10px;}
  .session-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #f0eee8;font-size:.9rem;}
  .session-row:first-of-type{border-top:none;}
  .session-date{font-weight:700;color:var(--navy);}
  .pdf-list{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .pdf-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--bg);border:1px solid #e7e4dd;border-radius:8px;padding:10px 14px;
  }
  .pdf-row .pdf-name{font-size:.86rem;color:var(--navy);font-weight:600;}
  .pdf-row .pdf-size{font-size:.75rem;color:var(--muted);margin-inline-start:6px;font-weight:400;}
  .pdf-actions{display:flex;gap:8px;flex-shrink:0;}
  .pdf-actions a, .pdf-actions button{
    font-family:inherit;font-size:.78rem;font-weight:700;cursor:pointer;
    border:1px solid #d8d4cb;background:var(--white);border-radius:6px;padding:5px 12px;color:var(--navy);
  }
  .pdf-actions a:hover, .pdf-actions button:hover{border-color:var(--gold);}
  .empty-state{text-align:center;color:var(--muted);padding:60px 20px;}
  .loading{text-align:center;color:var(--muted);padding:60px 20px;}
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <a href="../index.html#home"><img src="../assets/images/logo.png" alt="شعار مؤسسة د. حسن عبد المنعم حسن" class="brand-logo"></a>
    </div>
  </div>
</header>

<div class="dash-wrap">
  <div class="dash-head">
    <div>
      <h1>قضاياي</h1>
      <p class="who" id="whoText"></p>
    </div>
    <button class="btn-logout" id="logoutBtn">تسجيل الخروج</button>
  </div>

  <div id="content">
    <div class="loading">جارٍ تحميل بياناتك…</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, query, where, getDocs
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { firebaseConfig, COLLECTIONS } from "./portal-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const contentEl = document.getElementById("content");
  const whoText = document.getElementById("whoText");

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "index.html";
  });

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }
    whoText.textContent = user.email;

    try {
      // مؤكَّد مباشرة من Firestore: كل قضية فيها حقل clientUids (array
      // من auth uid) على مستوى المستند نفسه — بيتحدّث تلقائياً من تطبيق
      // المكتب كل 6 ساعات أول ما الموكل يسجّل دخول في البوابة لأول مرة.
      // القضايا القديمة (اللي اتحفظت قبل هذا التحديث) لسه من غير الحقل ده
      // لحد ما تطبيق المكتب يعيد حفظها — فممكن الموكل ميشوفش كل قضاياه
      // فوراً في أول أيام، وده طبيعي.
      const casesQuery = query(
        collection(db, COLLECTIONS.cases),
        where("clientUids", "array-contains", user.uid)
      );
      const casesSnap = await getDocs(casesQuery);

      if (casesSnap.empty) {
        contentEl.innerHTML = `<div class="empty-state">مفيش قضايا مرتبطة بحسابك حالياً. لو ده غير متوقع، ممكن قضيتك لسه محدّثتش من تطبيق المكتب — جرّب تاني بعد شوية، أو تواصل معانا.</div>`;
        return;
      }

      // كل مستند قضية شكله { json: "<نص JSON>", owner, updatedAt,
      // clientUids }. البيانات الفعلية (رقم الملف، الموضوع، المحكمة،
      // الحالة، الجلسات...) جوه نص الـ json ده ولازم JSON.parse.
      function parseCase(docSnap) {
        const raw = docSnap.data();
        let c = {};
        try { c = JSON.parse(raw.json || "{}"); } catch (e) { console.error("bad case json", docSnap.id, e); }
        return c;
      }

      let html = "";
      for (const caseDoc of casesSnap.docs) {
        const c = parseCase(caseDoc);
        const caseLabel = [c.caseNo, c.caseYear].filter(Boolean).join(" لسنة ");
        html += `
          <div class="case-card">
            <h3>${c.subject || "قضية بدون موضوع مسجّل"}</h3>
            <div class="case-meta">
              ${caseLabel ? `<span>رقم القضية: ${caseLabel}</span>` : ""}
              ${c.fileNo ? `<span>رقم الملف بالمكتب: ${c.fileNo}</span>` : ""}
              ${c.courtName ? `<span>المحكمة: ${c.courtName}</span>` : ""}
              ${c.caseType ? `<span>نوع الدعوى: ${c.caseType}</span>` : ""}
              ${c.status ? `<span>الحالة: ${c.status}</span>` : ""}
            </div>
            <div id="sessions-${caseDoc.id}"></div>
          </div>
        `;
      }
      contentEl.innerHTML = html;

      // عرض الجلسات — مصفوفة sessions جوه نفس القضية (مش كولكشن منفصل)
      for (const caseDoc of casesSnap.docs) {
        const c = parseCase(caseDoc);
        const sessionsEl = document.getElementById(`sessions-${caseDoc.id}`);
        if (Array.isArray(c.sessions) && c.sessions.length) {
          const sorted = [...c.sessions].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
          sessionsEl.innerHTML = sorted.map(s => {
            const note = (s.raw && (s.raw.result || s.raw.for)) || s.raw?.type || "جلسة";
            return `<div class="session-row"><span class="session-date">${s.date || ""}</span><span>${note}</span></div>`;
          }).join("");
        }
      }
    } catch (err) {
      contentEl.innerHTML = `<div class="empty-state">حصل خطأ في تحميل البيانات. حاول تاني لاحقاً.</div>`;
      console.error(err);
    }
  });
</script>
</body>
</html>
