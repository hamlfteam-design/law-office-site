<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قضاياي | بوابة الموكلين</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=20260924">
<style>
  @font-face{font-family:"SF Sultan";src:url("../assets/fonts/Sultan-Black.ttf") format("truetype");font-weight:700;font-display:swap;}
  @font-face{font-family:"SF Mada";src:url("../assets/fonts/SF-Mada-Bold.ttf") format("truetype");font-weight:700;font-display:swap;}
</style>
<script src="../assets/js/portal-letterhead.js?v=2" defer></script>
<script src="../assets/js/pdfdoc.js?v=3" defer></script>
<script src="../assets/js/pdfbuild.js" defer></script>
<script src="../assets/js/case-statement.js?v=2" defer></script>
<script src="../assets/js/portal-statements.js?v=4" defer></script>
<script>window.PDFVIEW_BASE = "../assets/";</script>
<script src="../assets/js/pdfview.js?v=1" defer></script>
<script src="../assets/js/portal-docs.js?v=1" defer></script>

<style>
  .dash-wrap{max-width:960px;margin:0 auto;padding:40px 20px 80px;}
  .dash-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
  .dash-head h1{font-size:1.4rem;color:var(--navy);}
  .dash-head .who{color:var(--muted);font-size:.9rem;}
  .btn-logout{background:none;border:1px solid #d8d4cb;border-radius:999px;padding:8px 18px;cursor:pointer;font-family:inherit;font-size:.85rem;color:var(--muted);}

  .case-card{background:var(--white);border:1px solid #e7e4dd;border-radius:var(--radius);padding:0;margin-bottom:22px;overflow:hidden;}
  .case-letterhead{width:100%;display:block;}
  .case-letterhead-rule{height:4px;background:linear-gradient(to left,#a3122a 0 50%, var(--navy) 50% 100%);}
  .case-card h3{color:var(--navy);margin:0;padding:18px 20px;border-bottom:1px solid #e7e4dd;font-size:1.1rem;}

  .case-table-wrap{overflow-x:auto;}
  table.case-table{width:100%;border-collapse:collapse;font-size:.88rem;}
  table.case-table caption{
    text-align:start;font-weight:700;color:var(--navy);background:var(--bg);
    padding:8px 20px;font-size:.85rem;
  }
  table.case-table th, table.case-table td{
    padding:9px 20px;text-align:start;border-top:1px solid #f0eee8;vertical-align:top;
  }
  table.case-table th{color:var(--muted);font-weight:600;width:38%;background:#fbfaf7;}
  table.case-table.parties th{width:22%;}
  table.sessions-table{width:100%;border-collapse:collapse;font-size:.85rem;}
  table.sessions-table caption{
    text-align:start;font-weight:700;color:var(--navy);background:var(--bg);
    padding:8px 20px;font-size:.85rem;
  }
  table.sessions-table th, table.sessions-table td{
    padding:8px 10px;text-align:center;border-top:1px solid #f0eee8;
  }
  table.sessions-table th{color:var(--muted);font-weight:600;background:#fbfaf7;font-size:.8rem;}
  table.sessions-table td.session-note-cell, table.sessions-table th.session-note-cell{text-align:start;}
  table.sessions-table tbody tr:nth-child(even){background:#fcfbf8;}

  .empty-state{text-align:center;color:var(--muted);padding:60px 20px;}
  .loading{text-align:center;color:var(--muted);padding:60px 20px;}

  .btn-print{background:var(--navy);color:#fff;border:none;border-radius:999px;padding:8px 18px;cursor:pointer;font-family:inherit;font-size:.85rem;}
  .case-actions{padding:12px 20px;text-align:start;}

  /* ================= طباعة / تصدير PDF بنفس شكل ورقة المكتب الرسمية ================= */
  @page { margin: 1.5cm 1.27cm; }
  @media print {
    body *{visibility:hidden;}
    .printing-case, .printing-case *{visibility:visible;}
    .printing-case{position:absolute;top:0;left:0;width:100%;margin:0;border:none;border-radius:0;}
    .case-actions{display:none !important;}
    .case-table-wrap{overflow:visible;}
    table.case-table, table.sessions-table{page-break-inside:auto;}
    tr{page-break-inside:avoid;}
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <a href="../index.html#home"><img src="../assets/images/logo.png" alt="شعار مؤسسة د. حسن عبد المنعم حسن" class="brand-logo"></a>
    </div>
  </div>
</header>

<div class="dash-wrap">
  <div class="dash-head">
    <div>
      <h1>قضاياي</h1>
      <p class="who" id="whoText"></p>
    </div>
    <div><span id="docsBtnHost"></span><button class="btn-logout" id="logoutBtn">تسجيل الخروج</button></div>
  </div>

  <div id="collabNotice"></div>
  <div id="content">
    <div class="loading">جارٍ تحميل بياناتك…</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, query, where, getDocs, getDoc, doc
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { firebaseConfig, COLLECTIONS } from "./portal-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  auth.languageCode = "ar";
  const db = getFirestore(app);

  const contentEl = document.getElementById("content");
  const whoText = document.getElementById("whoText");

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    if (window.PortalDocs) PortalDocs.logout();
    await signOut(auth);
    window.location.href = "index.html";
  });

  /* تأكيد الإيميل للمحامي المتعاون: رابط بيتبعت على إيميله، ولما يضغطه
     يرجع هنا ويدوس «أكّدت» — بنحدّث الجلسة عشان التأكيد يوصل لقواعد الأمان. */
  function showVerifyNotice(user) {
    const box = document.getElementById("collabNotice");
    box.innerHTML = `<div class="empty-state" style="padding:22px 18px;border:1px solid #f0d9a8;background:#fff8e8;border-radius:12px;margin-bottom:18px;color:#7a5c14;line-height:2">
      <b>أكّد إيميلك عشان تظهر لك القضايا المشتركة مع المكتب.</b><br>
      بعتنا رابط تأكيد على <span dir="ltr">${user.email}</span> — افتحه (وشيّك على الـSpam)، وبعدين ارجع هنا ودوس «أكّدت».<br>
      <button class="btn-logout" id="verifiedBtn" style="margin:8px 4px 0;color:#1d6b3a;border-color:#1d6b3a">✓ أكّدت</button>
      <button class="btn-logout" id="resendBtn" style="margin:8px 4px 0">ابعت الرابط تاني</button>
      <div id="verifyMsg" style="font-size:.85rem;margin-top:8px"></div></div>`;
    document.getElementById("verifiedBtn").onclick = async () => {
      await user.reload();
      if (auth.currentUser && auth.currentUser.emailVerified) {
        await auth.currentUser.getIdToken(true);
        window.location.reload();
      } else {
        document.getElementById("verifyMsg").textContent = "لسه الإيميل ما اتأكدش — افتح الرابط اللي في الإيميل الأول.";
      }
    };
    document.getElementById("resendBtn").onclick = async () => {
      try {
        await sendEmailVerification(user);
        document.getElementById("verifyMsg").textContent = "اتبعت رابط جديد على إيميلك.";
      } catch (e) {
        document.getElementById("verifyMsg").textContent = "تعذّر الإرسال دلوقتي (" + (e.code || e.message) + ") — جرّب بعد شوية.";
      }
    };
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }
    whoText.textContent = user.email;
    /* «📎 مستندات قضاياي» — كود على الإيميل ← مشاهدة بس في القارئ بعلامة مائية */
    if (window.PortalDocs && !document.getElementById("docsBtnHost").childNodes.length)
      PortalDocs.init(() => auth.currentUser.getIdToken(), user.email, document.getElementById("docsBtnHost"));

    try {
      // مؤكَّد مباشرة من Firestore: كل قضية فيها حقل clientUids (array
      // من auth uid) على مستوى المستند نفسه — بيتحدّث تلقائياً من تطبيق
      // المكتب كل 6 ساعات أول ما الموكل يسجّل دخول في البوابة لأول مرة.
      // القضايا القديمة (اللي اتحفظت قبل هذا التحديث) لسه من غير الحقل ده
      // لحد ما تطبيق المكتب يعيد حفظها — فممكن الموكل ميشوفش كل قضاياه
      // فوراً في أول أيام، وده طبيعي.
      const casesQuery = query(
        collection(db, COLLECTIONS.cases),
        where("clientUids", "array-contains", user.uid)
      );
      const casesSnap = await getDocs(casesQuery);

      /* محامي متعاون (portalEmails.collab): بيشوف القضايا المكتوب إيميله عليها
         (collabEmails) — للقراءة بس، وبعد ما يأكّد إيميله (قواعد الأمان بتشترط
         كده). فشل الاستعلام ده ما يوقفش عرض قضايا الموكل العادية. */
      const email = (user.email || "").toLowerCase();
      let isCollab = false;
      try {
        const ix = await getDoc(doc(db, "portalEmails", email));
        isCollab = ix.exists() && !!ix.data().collab;
      } catch (e) { /* فهرس مش متاح — كمّل كموكل عادي */ }
      let collabDocs = [];
      if (isCollab && !user.emailVerified) {
        showVerifyNotice(user);
      } else if (isCollab) {
        try {
          const cs = await getDocs(query(collection(db, COLLECTIONS.cases),
            where("collabEmails", "array-contains", email)));
          collabDocs = cs.docs;
        } catch (e) { console.warn("collab cases query failed", e); }
      }
      const seenIds = {};
      const allDocs = casesSnap.docs.concat(collabDocs).filter((d) => {
        if (seenIds[d.id]) return false;
        seenIds[d.id] = 1;
        return true;
      });

      if (!allDocs.length) {
        if (isCollab) {
          contentEl.innerHTML = user.emailVerified
            ? `<div class="empty-state">مفيش قضايا مربوطة بإيميلك حالياً. لو ده غير متوقع، تواصل مع المكتب.</div>`
            : "";
          return;
        }
        contentEl.innerHTML = `<div class="empty-state">مفيش قضايا مرتبطة بحسابك حالياً. لو ده غير متوقع، ممكن قضيتك لسه محدّثتش من تطبيق المكتب — جرّب تاني بعد شوية، أو تواصل معانا.</div>`;
        return;
      }

      // كل مستند قضية شكله { json: "<نص JSON>", owner, updatedAt,
      // clientUids }. البيانات الفعلية (رقم الملف، الموضوع، المحكمة،
      // الحالة، الجلسات...) جوه نص الـ json ده ولازم JSON.parse.
      function parseCase(docSnap) {
        const raw = docSnap.data();
        let c = {};
        try { c = JSON.parse(raw.json || "{}"); } catch (e) { console.error("bad case json", docSnap.id, e); }
        return c;
      }

      // قاعدة ثابتة للمكتب: كل الأرقام تُعرض بصيغة عربي هندي (٠١٢٣٤٥٦٧٨٩)
      const HINDI = ["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];
      function toHindi(v) {
        if (v === null || v === undefined) return "";
        return String(v).replace(/[0-9]/g, (d) => HINDI[+d]);
      }
      // تواريخ الجلسات مخزّنة ISO (yyyy-mm-dd) — نعرضها yyyy/mm/dd بأرقام
      // عربي هندي، نفس قاعدة المكتب في كل المستندات التانية.
      function formatDate(iso) {
        if (!iso) return "";
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
        if (!m) return toHindi(iso);
        return toHindi(`${m[1]}/${m[2]}/${m[3]}`);
      }
      function esc(v) {
        return (v === null || v === undefined) ? "" : String(v).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
      }
      // حقل clients/opponents نص واحد بيجمع أكتر من طرف مفصول بـ "·"
      function splitParties(v) {
        if (!v) return [];
        return String(v).split("·").map(s => s.trim()).filter(Boolean);
      }

      function renderCase(caseDoc, idx) {
        const c = parseCase(caseDoc);
        const caseLabel = [toHindi(c.caseNo), toHindi(c.caseYear)].filter(Boolean).join(" لسنة ");
        const firstLabel = (c.firstNo || c.firstYear)
          ? `أول درجة ${[toHindi(c.firstNo), toHindi(c.firstYear)].filter(Boolean).join(" لسنة ")}`
          : "";

        const infoRows = [
          ["رقم الملف", toHindi(c.fileNo)],
          ["سنة التعامل", toHindi(c.dealYear)],
          ["رقم الدعوى", caseLabel],
          ["درجة التقاضي", esc(c.courtLevel)],
          ["الحالة", esc(c.status)],
          ["نوع الدعوى", esc(c.caseType)],
          ["المحامي", esc(c.lawyer)],
          ["المحكمة", esc(c.courtName)],
          ["الدائرة", esc(c.circuit)],
          ["الموضوع", esc(c.subject)],
          ["ملاحظات", esc(firstLabel)],
        ].filter(([, val]) => val);

        const clients = splitParties(c.clients);
        const opponents = splitParties(c.opponents);
        const partyRows = [
          ...(clients.length ? [["الموكلون", clients.map(esc).join("، ")]] : []),
          ...(opponents.length ? [["الخصوم", opponents.map(esc).join("، ")]] : []),
        ];

        /* جلسة من غير تاريخ صحيح (زي 0000-00-00 من البرنامج القديم) ما تظهرش للموكل */
        const sessions = Array.isArray(c.sessions)
          ? c.sessions.filter((s) => /^\d{4}-\d{2}-\d{2}/.test(s.date || "") && !/^0000/.test(s.date))
              .sort((a, b) => (a.date || "").localeCompare(b.date || ""))
          : [];
        /* القرار متخزّن بأكتر من اسم: result / decision، وسبب التأجيل for / reason */
        const decisionOf = (s) => { const r = s.raw || {}; return r.result || r.decision || r["for"] || r.reason || ""; };

        return `
          <div class="case-card" id="case-${idx}">
            <img class="case-letterhead" src="../assets/images/letterhead/header_tight.png" alt="مؤسسة د. حسن عبد المنعم حسن">
            <div class="case-letterhead-rule"></div>
            <h3>${esc(c.subject) || "قضية بدون موضوع مسجّل"}</h3>
            <div class="case-actions">
              <button class="btn-print" data-print-case="case-${idx}">طباعة / حفظ PDF</button>
              <button class="btn-print" data-paper-pdf="${idx}" style="background:#7a5a2a;margin-inline-start:8px">📄 PDF على ورق المؤسسة</button>
            </div>

            ${infoRows.length ? `
            <div class="case-table-wrap">
              <table class="case-table">
                <caption>بيان الدعوى</caption>
                <tbody>
                  ${infoRows.map(([label, val]) => `<tr><th>${label}</th><td>${val}</td></tr>`).join("")}
                </tbody>
              </table>
            </div>` : ""}

            ${partyRows.length ? `
            <div class="case-table-wrap">
              <table class="case-table parties">
                <caption>الأطراف</caption>
                <tbody>
                  ${partyRows.map(([label, val]) => `<tr><th>${label}</th><td>${val}</td></tr>`).join("")}
                </tbody>
              </table>
            </div>` : ""}

            ${sessions.length ? `
            <div class="case-table-wrap">
              <table class="sessions-table">
                <caption>تتابع الجلسات</caption>
                <thead>
                  <tr>
                    <th>م</th>
                    <th>رول</th>
                    <th>تاريخ الجلسة</th>
                    <th>نوع الجلسة</th>
                    <th class="session-note-cell">ما تم بها من قرارات أو أحكام</th>
                  </tr>
                </thead>
                <tbody>
                  ${sessions.map((s, i) => `
                    <tr>
                      <td>${toHindi(i + 1)}</td>
                      <td>${toHindi(s.raw?.roll || "")}</td>
                      <td>${formatDate(s.date)}</td>
                      <td>${esc(s.raw?.type || "")}</td>
                      <td class="session-note-cell">${esc(decisionOf(s))}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>` : ""}
          </div>
        `;
      }

      PortalStatements.mount({
        el: contentEl, lang: "ar",
        cases: allDocs.map((d) => { const c = parseCase(d); if (!c.id) c.id = d.id; return c; })
      });
    } catch (err) {
      /* بدل رسالة عامة بتخفي السبب الحقيقي — نعرض كود/نص خطأ Firebase
         نفسه (زي permission-denied أو unavailable) عشان لو تكررت المشكلة
         نعرف بالظبط سببها من أول مرة بدل التخمين. */
      const detail = (err && (err.code || err.message)) ? String(err.code || err.message) : "";
      contentEl.innerHTML = `<div class="empty-state">حصل خطأ في تحميل البيانات. حاول تاني لاحقاً.` +
        (detail ? `<br><span style="font-size:.75rem;opacity:.6;direction:ltr;display:inline-block;margin-top:8px">${detail}</span>` : "") +
        `</div>`;
      console.error(err);
    }
  });
</script>
</body>
</html>
