# تكملة بيانات بوابة الموكلين تلقائياً (portalEmails + matchEmails + clientEmails)
# بيشغّل tools/portal-backfill كل ٣ ساعات، ويدوياً من تبويب Actions ← Run workflow.
# محتاج Secret في المستودع اسمه FIREBASE_SERVICE_ACCOUNT = محتوى ملف مفتاح الخدمة (JSON).
# السجل بيطبع أعداد بس — من غير إيميلات ولا أسماء.
# القراءة من Firestore باللي اتغيّر بس: كاش محلي مشفّر بيتحفظ بين التشغيلات (actions/cache)،
# وقراءة كاملة احتياطي مرة في الأسبوع أو لو الكاش ضاع.
name: Portal backfill

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/portal-backfill
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/portal-backfill/package-lock.json
      - name: Check secret
        id: secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is not set — skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci --no-audit --no-fund
        if: steps.secret.outputs.ok == 'true'
      - run: npm test
        if: steps.secret.outputs.ok == 'true'
      - name: Restore state cache
        if: steps.secret.outputs.ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: tools/portal-backfill/state
          key: portal-backfill-state-${{ github.run_id }}
          restore-keys: portal-backfill-state-
      - name: Backfill
        if: steps.secret.outputs.ok == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        # حد ٣٠٠ تعديل في المرة: أكتر من كده يبقى حاجة غريبة — بيقف ويبعتلك إيميل فشل من GitHub
        run: node backfill.mjs --apply --no-report --max-writes=300
      - name: Save state cache
        if: steps.secret.outputs.ok == 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: tools/portal-backfill/state
          key: portal-backfill-state-${{ github.run_id }}-${{ github.run_attempt }}
