<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="ttl">
<title id="ttl">طرق الطعن في الأحكام الجنائية</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#141414"/>
    <stop offset="1" stop-color="#0a0a0a"/>
  </linearGradient>
</defs>
<rect width="1200" height="420" fill="url(#bg)"/>
<rect x="18" y="18" width="1164" height="384" fill="none" stroke="#c9a35f" stroke-opacity=".25" stroke-width="1.5"/>

<!-- courthouse columns, left -->
<g transform="translate(95,95)" stroke="#c9a35f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M-20 90 L100 20 L220 90"/>
  <path d="M-25 100 L225 100"/>
  <path d="M0 110 L0 210 M45 110 L45 210 M90 110 L90 210 M135 110 L135 210 M180 110 L180 210"/>
  <path d="M-25 220 L225 220"/>
  <path d="M-35 235 L235 235"/>
</g>

<!-- scales of justice, center -->
<g transform="translate(600,70)" stroke="#c9a35f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="0" cy="10" r="9" fill="#c9a35f" stroke="none"/>
  <path d="M0 19 L0 220"/>
  <path d="M-90 230 Q0 260 90 230"/>
  <path d="M-140 45 L140 45"/>
  <path d="M-140 45 L-140 90"/>
  <path d="M140 45 L140 90"/>
  <path d="M-185 90 Q-140 130 -95 90"/>
  <path d="M95 90 Q140 130 185 90"/>
</g>

<!-- gavel, right -->
<g transform="translate(870,110)" stroke="#c9a35f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <g transform="rotate(-35 60 40)">
    <rect x="10" y="15" width="100" height="50" rx="9"/>
    <path d="M60 15 L60 65" stroke-width="3"/>
    <path d="M10 40 L-35 40"/>
  </g>
  <path d="M120 175 L200 175" stroke-width="6"/>
  <path d="M160 175 L160 90" stroke-width="6"/>
</g>

<!-- appeal path, bottom -->
<g stroke="#c9a35f" stroke-opacity=".55" stroke-width="3" fill="none" stroke-linecap="round">
  <path d="M120 345 L1080 345" stroke-dasharray="2 14"/>
</g>
<g fill="#c9a35f">
  <circle cx="160" cy="345" r="7"/>
  <circle cx="440" cy="345" r="7"/>
  <circle cx="720" cy="345" r="7"/>
  <circle cx="1000" cy="345" r="7"/>
</g>
<g font-family="Arial, sans-serif" font-size="19" fill="#e0c184" text-anchor="middle">
  <text x="160" y="380">معارضة</text>
  <text x="440" y="380">استئناف</text>
  <text x="720" y="380">نقض</text>
  <text x="1000" y="380">إعادة النظر</text>
</g>
</svg>

