<script>
/* =============================================================================
   تخصيص القضايا للمحامين — لمدير المكتب بس (قسم «team» في team.js).
   تختار المحامي، تفلتر، تعلّم على القضايا، وتدوس «خصّص»: خانة «المحامي» في
   كل قضية بتتكتب باسمه وبتترفع للسحابة (CaseFile.commitAll). ده اللي بيحدد
   «قضاياه» لما تختار «كل محامي يشوف قضاياه بس» من شاشة المحامين.
   ============================================================================= */
(function () {
  "use strict";
  var KEY = "proflawyer.agenda.cases.v1";
  var PAGE = 200;
  var sel = {}, shown = PAGE, status = "متداولة", only = "all";

  function ar(n) { return String(n == null ? "" : n).replace(/[0-9]/g, function (d) { return "٠١٢٣٤٥٦٧٨٩"[+d]; }); }
  function la(t) { return String(t == null ? "" : t).replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 0x0660; }); }
  function norm(s) {
    return String(s || "").replace(/[ًٌٍَُِّْـ]/g, "").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه")
      .replace(/\s+/g, " ").trim();
  }
  function read() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
  function el(t, cls, txt) { var e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

  /* المحامين من «المحامون والصلاحيات» + أي اسم مكتوب فعلاً في خانة المحامي */
  function lawyers() {
    var names = [], seen = {};
    function add(n) { n = String(n || "").trim(); var k = norm(n); if (n && !seen[k]) { seen[k] = 1; names.push(n); } }
    var T = window.Team && Team.data;
    (T && T.users || []).filter(function (u) { return u.role !== "owner"; }).forEach(function (u) { if (u.active !== false) add(u.name); });
    (T && T.users || []).filter(function (u) { return u.role === "owner"; }).forEach(function (u) { add(u.name); });
    read().forEach(function (c) { String(c.lawyer || "").split(/\s*[-–،,]\s*/).forEach(add); });
    return names;
  }
  var lawSel = document.getElementById("lawyer");
  lawyers().forEach(function (n) { var o = el("option", "", n); o.value = n; lawSel.appendChild(o); });

  var CHIPS = [["متداولة", "المتداولة"], ["", "كل القضايا"], ["منتهية", "المنتهية"]];
  var ONLY = [["all", "كل المحامين"], ["none", "اللي مالهاش محامي"], ["this", "متخصصة للمحامي ده"]];
  function drawChips() {
    var box = document.getElementById("chips"); box.textContent = "";
    CHIPS.forEach(function (c) {
      var b = el("button", status === c[0] ? "on" : "", c[1]); b.type = "button";
      b.onclick = function () { status = c[0]; shown = PAGE; drawChips(); draw(); }; box.appendChild(b);
    });
    ONLY.forEach(function (c) {
      var b = el("button", only === c[0] ? "on" : "", c[1]); b.type = "button";
      b.onclick = function () { only = c[0]; shown = PAGE; drawChips(); draw(); }; box.appendChild(b);
    });
  }

  function hasLawyer(c, n) {
    var law = norm(c.lawyer); if (!law) return false;
    return law.split(/\s*[-–،,]\s*/).some(function (x) { return x && (x === norm(n) || x.indexOf(norm(n)) === 0 || norm(n).indexOf(x) === 0 && x.split(" ").length >= 2); });
  }
  function filtered() {
    var q = norm(la(document.getElementById("q").value)), me = lawSel.value;
    return read().filter(function (c) {
      if (status && String(c.status || "") !== status) return false;
      if (only === "none" && String(c.lawyer || "").trim()) return false;
      if (only === "this" && !hasLawyer(c, me)) return false;
      if (!q) return true;
      var hay = norm(la([c.fileNo, c.caseNo, c.caseYear, c.clients, c.opponents, c.courtName, c.circuit, c.subject, c.lawyer].join(" ")));
      return q.split(" ").every(function (w) { return hay.indexOf(w) >= 0; });
    }).sort(function (a, b) { return (+la(b.fileNo) || 0) - (+la(a.fileNo) || 0); });
  }

  function draw() {
    var all = filtered(), box = document.getElementById("list");
    box.textContent = "";
    all.slice(0, shown).forEach(function (c) {
      var row = el("label", "cs" + (sel[c.id] ? " on" : ""));
      var cb = el("input"); cb.type = "checkbox"; cb.checked = !!sel[c.id];
      cb.onchange = function () { if (cb.checked) sel[c.id] = 1; else delete sel[c.id]; row.className = "cs" + (cb.checked ? " on" : ""); stat(all.length); };
      var body = el("div");
      body.appendChild(el("div", "t", "ملف " + ar(la(c.fileNo) || "—") + " · دعوى " + ar(la(c.caseNo) || "—") + (c.caseYear ? " لسنة " + ar(la(c.caseYear)) : "") +
        (c.status ? " · " + c.status : "")));
      body.appendChild(el("div", "m", [c.courtName, c.circuit].filter(Boolean).join(" — ")));
      body.appendChild(el("div", "m", "الموكل: " + String(c.clients || "—").slice(0, 120)));
      var lw = String(c.lawyer || "").trim();
      body.appendChild(el("div", "lw " + (lw ? "has" : "none"), lw ? "المحامي: " + lw : "مالهاش محامي"));
      row.appendChild(cb); row.appendChild(body); box.appendChild(row);
    });
    document.getElementById("more").hidden = all.length <= shown;
    stat(all.length);
  }
  function stat(total) {
    var n = Object.keys(sel).length;
    document.getElementById("stat").textContent = "ظاهر " + ar(Math.min(total, shown)) + " من " + ar(total) + " قضية · متعلّم عليه " + ar(n);
    document.getElementById("assign").disabled = !n || !lawSel.value;
    document.getElementById("clear").disabled = !n;
    document.getElementById("assign").textContent = n ? "خصّص " + ar(n) + " لـ" + (lawSel.value || "…") : "خصّص";
  }

  function apply(fn, msg) {
    var ids = Object.keys(sel); if (!ids.length) return;
    var list = read(), n = 0;
    list.forEach(function (c) { if (sel[c.id]) { var before = c.lawyer || ""; fn(c); if ((c.lawyer || "") !== before) n++; } });
    if (!n) { alert("مفيش تغيير."); return; }
    var ok = (window.CaseFile && CaseFile.commitAll) ? CaseFile.commitAll(list) : (localStorage.setItem(KEY, JSON.stringify(list)), true);
    if (!ok) return;
    sel = {};
    if (window.PL && PL.toast) PL.toast("اتحفظ", msg.replace("{n}", ar(n)), ""); else alert(msg.replace("{n}", ar(n)));
    draw();
  }
  document.getElementById("assign").onclick = function () {
    var name = lawSel.value, mode = document.getElementById("mode").value;
    if (!name) return;
    var n = Object.keys(sel).length;
    var go = function () {
      apply(function (c) {
        var cur = String(c.lawyer || "").trim();
        if (mode === "add" && cur && !hasLawyer(c, name)) c.lawyer = cur + " - " + name;
        else if (mode === "set" || !cur) c.lawyer = name;
      }, "اتخصّص {n} قضية لـ" + name + ".");
    };
    if (window.Ask && Ask.confirm) Ask.confirm("تخصيص " + ar(n) + " قضية لـ«" + name + "»؟", {
      danger: false, ok: "خصّص", cancel: "تراجع",
      detail: mode === "set" ? "اسمه هيتكتب في خانة «المحامي» بدل أي اسم موجود." : "اسمه هيتضاف جنب المحامي الموجود."
    }, go); else if (confirm("تخصيص " + n + " قضية لـ" + name + "؟")) go();
  };
  document.getElementById("clear").onclick = function () {
    var n = Object.keys(sel).length;
    var go = function () { apply(function (c) { c.lawyer = ""; }, "اتشال المحامي من {n} قضية."); };
    if (window.Ask && Ask.confirm) Ask.confirm("شيل المحامي من " + ar(n) + " قضية؟", { danger: true, ok: "شيل", cancel: "تراجع" }, go);
    else if (confirm("شيل المحامي من " + n + " قضية؟")) go();
  };
  document.getElementById("selAll").onclick = function () { filtered().slice(0, shown).forEach(function (c) { sel[c.id] = 1; }); draw(); };
  document.getElementById("selNone").onclick = function () { sel = {}; draw(); };
  document.getElementById("more").onclick = function () { shown += PAGE; draw(); };
  var qt = null;
  document.getElementById("q").oninput = function () { clearTimeout(qt); qt = setTimeout(function () { shown = PAGE; draw(); }, 250); };
  lawSel.onchange = function () { if (only === "this") draw(); else stat(filtered().length); };
  drawChips(); draw();
})();
</script>
