<script>
(function () {
  "use strict";
  var RS = window.RouteSheet;
  var ar = (window.CaseFile && CaseFile.ar) || function (x) { return String(x == null ? "" : x); };
  var groups = [];

  function el(t, css, txt) {
    var e = document.createElement(t);
    if (css) e.style.cssText = css;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function removeItem(g, it) {
    var i = g.items.indexOf(it);
    if (i >= 0) g.items.splice(i, 1);
    groups = groups.filter(function (x) { return x.items.length; });
    draw();
  }
  function move(g, it, dir) {
    var i = g.items.indexOf(it);
    var j = i + dir;
    if (j < 0 || j >= g.items.length) return;
    var tmp = g.items[i]; g.items[i] = g.items[j]; g.items[j] = tmp;
    draw();
  }

  function card(g, it) {
    var r = el("div"); r.className = "it";
    var hd = el("div"); hd.className = "hd";
    hd.appendChild(el("div", "", it.label)).className = "lb";
    hd.appendChild(el("div", "", it.date ? RS.dayDate(it.date) : "—")).className = "dt";
    r.appendChild(hd);
    r.appendChild(el("div", "", it.sub)).className = "sb";

    var note = document.createElement("textarea");
    note.placeholder = "ملاحظة (اختياري)…";
    note.value = it.note || "";
    note.addEventListener("input", function () { it.note = note.value; });
    r.appendChild(note);

    var ac = el("div"); ac.className = "ac";
    var up = el("button", "", "↑"); up.type = "button"; up.onclick = function () { move(g, it, -1); };
    var down = el("button", "", "↓"); down.type = "button"; down.onclick = function () { move(g, it, 1); };
    var del = el("button", "color:#b3261e", "✕ حذف"); del.type = "button"; del.onclick = function () { removeItem(g, it); };
    ac.appendChild(up); ac.appendChild(down); ac.appendChild(del);
    r.appendChild(ac);
    return r;
  }

  function draw() {
    var body = document.getElementById("body");
    var stat = document.getElementById("stat");
    body.textContent = "";
    var total = groups.reduce(function (n, g) { return n + g.items.length; }, 0);
    if (!total) {
      body.appendChild(el("div", "", "لا أعمال مفتوحة ولا جلسات اطلاع فائتة حالياً.")).className = "empty";
      stat.textContent = "";
      return;
    }
    stat.textContent = ar(total) + " بند في " + ar(groups.length) + " محكمة — مرتَّبة بأقرب موعد.";
    groups.forEach(function (g) {
      var box = el("div"); box.className = "crt";
      box.appendChild(el("h3", "", "🏛 " + g.court));
      g.items.forEach(function (it) { box.appendChild(card(g, it)); });
      body.appendChild(box);
    });
  }

  function load() {
    groups = RS.groupByCourt(RS.collectItems());
    draw();
  }

  document.getElementById("exportBtn").onclick = function () {
    var total = groups.reduce(function (n, g) { return n + g.items.length; }, 0);
    if (!total) { alert("لا بنود لتصديرها."); return; }
    RS.exportDoc(groups, function (ok) {
      if (!ok) alert("تعذّر التصدير على هذا الجهاز.");
    });
  };

  load();
})();
</script>
