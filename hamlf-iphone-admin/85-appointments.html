<script>
/* =============================================================================
   المواعيد — تخزين مستقل عن سجلات الشاشات لأن لكل موعد حالته وتذكيره.

   ⚠️ التذكير يعمل ما دام التطبيق مفتوحاً على هذه الشاشة. الإشعار وهاتفك
      مغلق يحتاج خدمة إشعارات على السيرفر — غير متاح في هذه النسخة.
   ============================================================================= */
(function () {
  "use strict";

  var KEY = "proflawyer.appointments.v1";
  var fired = {};

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
  }
  function save(a) {
    try { localStorage.setItem(KEY, JSON.stringify(a)); return true; } catch (e) { return false; }
  }

  function v(id) { var e = document.getElementById(id); return e ? e.value.trim() : ""; }

  function when(a) {
    // التواريخ تُخزَّن كما تُعرض (عربية) فنعيدها لاتينية قبل الحساب
    var la = function (t) {
      return String(t || "").replace(/[٠-٩]/g,
        function (d) { return d.charCodeAt(0) - 0x0660; }).replace(/\//g, "-");
    };
    return new Date(la(a.date) + "T" + (la(a.time) || "09:00"));
  }

  function fmt(a) {
    var d = when(a);
    var day = d.toLocaleDateString("ar-EG",
      { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    var hm = a.time ? d.toLocaleTimeString("ar-EG",
      { hour: "2-digit", minute: "2-digit" }) : "";
    return day + (hm ? " · " + hm : "");
  }

  document.getElementById("apAdd").addEventListener("click", function () {
    var t = v("apTitle"), d = v("apDate");
    if (!t) { alert("اكتب موضوع الموعد."); document.getElementById("apTitle").focus(); return; }
    if (!d) { alert("اختر تاريخ الموعد."); document.getElementById("apDate").focus(); return; }

    var all = load();
    all.push({
      id: "ap" + Date.now(),
      title: t, with: v("apWith"), date: d, time: v("apTime"),
      kind: v("apKind"), before: parseInt(v("apBefore"), 10) || 30,
      notes: v("apNotes"), done: false
    });
    if (!save(all)) { alert("تعذّر الحفظ — المساحة ممتلئة."); return; }

    ["apTitle", "apWith", "apNotes"].forEach(function (id) {
      document.getElementById(id).value = "";
    });
    draw();
    if (window.PL) window.PL.toast("أُضيف الموعد", fmt(all[all.length - 1]), "");
  });

  function draw() {
    var box = document.getElementById("apList");
    box.textContent = "";
    var all = load().sort(function (a, b) { return when(a) - when(b); });

    if (!all.length) {
      var e = document.createElement("div");
      e.style.cssText = "text-align:center;color:var(--muted);padding:26px;font-size:14px";
      e.textContent = "لا توجد مواعيد بعد.";
      box.appendChild(e);
      return;
    }

    var now = Date.now();
    all.forEach(function (a) {
      var diffMin = (when(a) - now) / 60000;
      var soon = !a.done && diffMin > 0 && diffMin <= a.before;
      var past = !a.done && diffMin < 0;

      var c = document.createElement("div");
      c.className = "ap" + (soon ? " soon" : "") + (a.done ? " done" : "");

      var top = document.createElement("div"); top.className = "ap-top";
      var ttl = document.createElement("span"); ttl.className = "ap-ttl";
      ttl.textContent = a.title;
      var chip = document.createElement("span");
      chip.className = "chip" + (soon ? " now" : "");
      chip.textContent = a.done ? "تم" : (soon ? "قريب جداً" : (past ? "فات" : a.kind || "موعد"));
      top.appendChild(ttl); top.appendChild(chip);
      c.appendChild(top);

      var w = document.createElement("div"); w.className = "ap-when";
      w.textContent = fmt(a) + (a.with ? "  ·  مع: " + a.with : "") +
                      (a.notes ? "\n" + a.notes : "");
      w.style.whiteSpace = "pre-line";
      c.appendChild(w);

      var act = document.createElement("div"); act.className = "ap-act";
      [[a.done ? "إرجاع" : "تم", function () {
          var all2 = load();
          all2.forEach(function (x) { if (x.id === a.id) x.done = !x.done; });
          save(all2); draw();
        }],
       ["تذكير الآن", function () {
          if (window.PL) window.PL.toast("تذكير", a.title + " — " + fmt(a), "urgent");
        }],
       ["حذف", function () {
          if (!confirm("حذف موعد «" + a.title + "»؟")) return;
          save(load().filter(function (x) { return x.id !== a.id; }));
          draw();
        }]].forEach(function (p) {
        var b = document.createElement("button");
        b.type = "button"; b.textContent = p[0]; b.onclick = p[1];
        if (p[0] === "حذف") b.style.color = "#b3261e";
        act.appendChild(b);
      });
      c.appendChild(act);
      box.appendChild(c);
    });
  }

  /* التذكير الصوتي: يفحص كل نصف دقيقة ما دامت الشاشة مفتوحة */
  function tick() {
    var now = Date.now();
    var due = load().filter(function (a) {
      if (a.done || fired[a.id]) return false;
      var m = (when(a) - now) / 60000;
      return m <= a.before && m > -60;
    });
    due.forEach(function (a) {
      fired[a.id] = true;
      if (window.PL) window.PL.toast("موعد قادم", a.title + " — " + fmt(a), "urgent");
    });

    var box = document.getElementById("dueBox");
    var soon = load().filter(function (a) {
      if (a.done) return false;
      var m = (when(a) - now) / 60000;
      return m > 0 && m <= a.before;
    });
    if (soon.length) {
      box.hidden = false;
      box.textContent = "🔔 " + soon.length + " موعد خلال وقت قصير: " +
        soon.map(function (a) { return a.title; }).join(" · ");
    } else { box.hidden = true; }
  }

  draw();
  tick();
  setInterval(tick, 30000);
})();
</script>
