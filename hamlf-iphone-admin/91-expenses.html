  .ex .amt.out { background:#b3261e; color:#fff; }
  .ex .ttl { flex:1; font-family:var(--f-title); font-size:14.5px; line-height:1.7;
             word-break:break-word; }
  .ex .r { display:flex; gap:8px; font-size:12.5px; color:var(--muted);
           margin-top:6px; line-height:1.9; }
  .ex .r b { flex:0 0 82px; color:var(--brand-dark); font-family:var(--f-title);

  .ex .r span { flex:1; word-break:break-word; }
  .ex .act { display:flex; gap:7px; margin-top:10px; }
  .ex .act button { flex:1; min-height:42px; border:1px solid var(--line);

<script>
(function () {
  "use strict";

  var mode = "all";
  var ar = Expenses.ar, fmt = Expenses.fmt, money = Expenses.money;

  function el(t, css, txt) {
    var e = document.createElement(t);
    if (css) e.style.cssText = css;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function filterOf() {
    if (mode === "case")    return function (r) { return r.scope === "مصروفات قضية"; };
    if (mode === "office")  return function (r) { return r.scope === "مصروفات المكتب"; };
    if (mode === "custody") return function (r) { return r.kind === "عهدة مستلمة"; };
    return null;
  }

  /* ثلاث خانات منفصلة: العهدة · المصروف · الرصيد */
  function drawMoney() {
    var t = Expenses.totals(filterOf());
    var box = document.getElementById("money");
    box.textContent = "";
    [["العهدة المستلمة", t.custody, "cu"],
     ["المصروف", t.spent, "sp"],
     ["الرصيد", t.balance, "ba"]].forEach(function (p) {
      var d = el("div");
      d.className = p[2];
      d.appendChild(el("div", "", p[0])).className = "l";
      d.appendChild(el("div", "", fmt(p[1]))).className = "n";
      box.appendChild(d);
    });
  }

  function row(label, value) {
    var r = el("div"); r.className = "r";
    r.appendChild(el("b", "", label));
    r.appendChild(el("span", "", value));
    return r;
  }

  function current() {
    var q = document.getElementById("q").value.trim();
    var list = Expenses.search(q);
    var f = filterOf();
    return f ? list.filter(f) : list;
  }

  function draw() {
    var list = current();

    document.getElementById("stat").textContent =
      list.length ? "المعروض: " + ar(list.length) + " حركة"
                  : "لا حركات مسجَّلة — اضغط «حركة جديدة».";

    var box = document.getElementById("list");
    box.textContent = "";

    list.forEach(function (r) {
      var card = el("div"); card.className = "ex";
      var isIn = r.kind === "عهدة مستلمة";

      var hd = el("div"); hd.className = "hd";
      var a = el("span", "", (isIn ? "+ " : "− ") + fmt(money(r.amount)));
      a.className = "amt " + (isIn ? "in" : "out");
      hd.appendChild(a);
      hd.appendChild(el("span", "",
        r.item || (isIn ? "عهدة مستلمة" : "مصروف"))).className = "ttl";
      card.appendChild(hd);

      if (r.date)  card.appendChild(row("التاريخ", ar(String(r.date).replace(/-/g, "/"))));
      if (r.scope) card.appendChild(row("على حساب",
        r.scope + (r.fileNo ? " — ملف " + ar(r.fileNo) : "")));
      if (r.client) card.appendChild(row("الموكل", r.client));
      if (r.by)     card.appendChild(row("القائم بالصرف", r.by));
      if (r.charge) card.appendChild(row("التحميل", r.charge));
      if (r.notes)  card.appendChild(row("ملاحظات", r.notes));

      var act = el("div"); act.className = "act";
      function b(label, on) {
        var x = document.createElement("button");
        x.type = "button"; x.textContent = label; x.onclick = on;
        act.appendChild(x);
        return x;
      }
      b("✎ تعديل", function () {
        Expenses.edit(r.id, function () { drawMoney(); draw(); });
      });
      var d = b("🗑 حذف", function () {
        Expenses.remove(r.id, function () { drawMoney(); draw(); });
      });
      d.style.color = "#b3261e";
      d.style.borderColor = "#e3c9c6";
      card.appendChild(act);

      box.appendChild(card);
    });
  }

  var timer;
  document.getElementById("q").addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(draw, 160);
  });

  document.querySelectorAll(".tabs2 button").forEach(function (b) {
    b.onclick = function () {
      mode = b.getAttribute("data-mode");
      document.querySelectorAll(".tabs2 button").forEach(function (x) {
        x.classList.remove("on");
      });
      b.classList.add("on");
      document.getElementById("analyze").onclick = function () { Expenses.showAnalysis(); };
  setTimeout(function () { Expenses.pullFromCloud(function (ok, n) { if (n) { drawMoney(); draw(); } }); }, 1500);

  drawMoney();
      draw();
    };
  });

  document.getElementById("add").onclick = function () {
    Expenses.edit(null, function () { drawMoney(); draw(); });
  };

  document.getElementById("print").onclick = function () {
    Expenses.print(current(), Expenses.totals(filterOf()));
  };

  drawMoney();
  draw();
})();
</script>
