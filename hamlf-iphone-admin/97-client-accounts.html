<script>
(function () {
  "use strict";
  var CF = window.CaseFile, EX = window.Expenses;
  var ar = (CF && CF.ar) || function (x) { return String(x == null ? "" : x); };
  var norm = (CF && CF.norm) || function (x) { return String(x || "").toLowerCase(); };
  function money(v) { return EX && EX.money ? EX.money(v) : (parseFloat(String(v).replace(/[^0-9.\-]/g, "")) || 0); }
  function fmt(v) { return EX && EX.fmt ? EX.fmt(v) : String(Math.round(v)); }

  function el(t, css, txt) { var e = document.createElement(t); if (css) e.style.cssText = css; if (txt != null) e.textContent = txt; return e; }
  function cases() { return (CF && CF.all && CF.all()) || []; }
  function moves() { return (EX && EX.all && EX.all()) || []; }

  function la(t) { return String(t == null ? "" : t).replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 0x0660; }); }
  function caseFinance(c) {
    var fn = la(c.fileNo || "").trim();
    var collected = 0, spent = 0;
    if (fn) moves().forEach(function (r) {
      if (la(r.fileNo || "").trim() !== fn) return;
      if (r.kind === "عهدة مستلمة") collected += money(r.amount); else spent += money(r.amount);
    });
    return { collected: collected, spent: spent };
  }
  /* مطابقة تامة لاسم أحد الموكلين في القضية — الاحتواء الجزئي كان بيجيب لـ«محمد
     أحمد» قضايا «محمد أحمد علي» وفلوسها في كشف حسابه (F-CLI-2). */
  function partyNames(txt) {
    return String(txt || "").split(/\s*·\s*/).map(function (part) {
      if (/^ورثة\./.test(part.trim())) return "";
      return norm(part.replace(/^\s*[٠-٩0-9]+\s*[.\-)]\s*/, "").replace(/\(.*?\)/g, "")
        .replace(/\s*[-–]\s*(مدعي|مستأنف|طاعن|متهم|مدعى|مجني|شاكي)\S*.*$/, "").trim());
    }).filter(Boolean);
  }
  function isClientOf(c, name) {
    var k = norm(name);
    return !!k && partyNames(c.clients).indexOf(k) >= 0;
  }
  function clientCases(name) {
    if (!norm(name)) return [];
    return cases().filter(function (c) { return isClientOf(c, name); });
  }

  /* قائمة أسماء الموكلين للاقتراح */
  function fillNames() {
    var set = {}, out = [];
    cases().forEach(function (c) {
      String(c.clients || "").split("·").forEach(function (p) {
        var nm = p.replace(/\([^)]*\)/g, "").trim();
        if (nm && !set[norm(nm)]) { set[norm(nm)] = 1; out.push(nm); }
      });
    });
    out.sort(function (a, b) { return a.localeCompare(b, "ar"); });
    ["dlC", "dlC2"].forEach(function (id) {
      var dl = document.getElementById(id); if (!dl) return;
      dl.textContent = "";
      out.slice(0, 800).forEach(function (nm) { var o = document.createElement("option"); o.value = nm; dl.appendChild(o); });
    });
  }

  function drawAcct() {
    var body = document.getElementById("acctBody");
    body.textContent = "";
    var name = document.getElementById("cName").value.trim();
    if (!name) { body.appendChild(el("div", "color:var(--muted);font-size:13.5px;padding:8px 0", "اكتب اسم الموكل لعرض كشف حسابه المجمّع.")); return; }
    var list = clientCases(name);
    if (!list.length) { body.appendChild(el("div", "color:var(--muted);font-size:13.5px;padding:8px 0", "لا قضايا مطابقة لهذا الاسم.")); return; }

    var tAgreed = 0, tColl = 0, tSpent = 0, pctNote = 0;
    list.forEach(function (c) {
      var f = caseFinance(c);
      tColl += f.collected; tSpent += f.spent;
      if (c.feeKind === "نسبة") pctNote++;
      else tAgreed += money(c.feeStart);
    });

    var tot = el("div"); tot.className = "tot";
    [["الأتعاب (قيمية)", fmt(tAgreed)], ["المحصّل", fmt(tColl)], ["المصروفات", fmt(tSpent)],
     ["المتبقي", fmt(tAgreed - tColl)]].forEach(function (p) {
      var d = el("div"); d.appendChild(el("div", "", p[0])).className = "l";
      d.appendChild(el("div", "", p[1])).className = "n"; tot.appendChild(d);
    });
    body.appendChild(tot);
    if (pctNote) body.appendChild(el("div", "font-size:12px;color:var(--muted);margin-bottom:10px",
      "* " + ar(pctNote) + " قضية بأتعاب نسبة مئوية لا تدخل الإجماليات القيمية."));

    list.forEach(function (c) {
      var f = caseFinance(c);
      var card = el("div"); card.className = "cs";
      card.appendChild(el("div", "", "ملف " + ar(c.fileNo || "—") + " · دعوى " + ar(c.caseNo || "—") +
        (c.caseYear ? "/" + ar(c.caseYear) : ""))).className = "h";
      function r(k, v) { if (!v && v !== 0) return; var x = el("div"); x.className = "r"; x.appendChild(el("b", "", k)); x.appendChild(el("span", "", v)); card.appendChild(x); }
      r("المحكمة", [c.courtName, c.circuit].filter(Boolean).join(" — "));
      r("الموضوع", c.subject);
      r("الحالة", c.status);
      r("الأتعاب", c.feeKind === "نسبة" ? (c.feePct ? ar(c.feePct) + "%" : "نسبة") : (c.feeStart ? fmt(money(c.feeStart)) + " ج" : "—"));
      r("المحصّل", fmt(f.collected) + " ج");
      r("المصروفات", fmt(f.spent) + " ج");
      if (c.feeKind !== "نسبة" && c.feeStart) r("المتبقي", fmt(money(c.feeStart) - f.collected) + " ج");
      card.onclick = function () { if (CF && CF.openCase) CF.openCase(c.id, drawAcct); };
      body.appendChild(card);
    });
  }

  function drawTax() {
    var body = document.getElementById("taxBody");
    body.textContent = "";
    var yr = la(document.getElementById("tYear").value.trim());
    var nm = document.getElementById("tName").value.trim();
    if (!yr) { body.appendChild(el("div", "color:var(--muted);font-size:13.5px;padding:8px 0", "اكتب سنة التعامل لبناء التقرير الضريبي.")); return; }
    var list = cases().filter(function (c) {
      if (la(c.dealYear || "").trim() !== yr) return false;
      if (nm && !isClientOf(c, nm)) return false;
      return true;
    });
    if (!list.length) { body.appendChild(el("div", "color:var(--muted);font-size:13.5px;padding:8px 0", "لا قضايا في هذه السنة.")); return; }

    var wrap = el("div", "overflow-x:auto");
    var tbl = document.createElement("table");
    var hr = tbl.insertRow();
    ["الملف", "الموكل", "الدعوى", "المحصّل", "المصروفات", "الصافي"].forEach(function (h) {
      var th = document.createElement("th"); th.textContent = h; hr.appendChild(th);
    });
    var tC = 0, tS = 0;
    list.forEach(function (c) {
      var f = caseFinance(c); tC += f.collected; tS += f.spent;
      var tr = tbl.insertRow();
      var firstClient = String(c.clients || "").split("·")[0].replace(/\([^)]*\)/g, "").trim();
      [ar(c.fileNo || "—"), firstClient || "—", ar(c.caseNo || "—") + (c.caseYear ? "/" + ar(c.caseYear) : ""),
       fmt(f.collected), fmt(f.spent), fmt(f.collected - f.spent)].forEach(function (v) {
        tr.insertCell().textContent = v;
      });
    });
    var tr = tbl.insertRow();
    ["الإجمالي", "", "", fmt(tC), fmt(tS), fmt(tC - tS)].forEach(function (v) {
      var td = tr.insertCell(); td.textContent = v; td.style.fontFamily = "var(--f-title)"; td.style.background = "#f5f0e6";
    });
    wrap.appendChild(tbl); body.appendChild(wrap);
  }

  document.getElementById("tAcct").onclick = function () {
    this.className = "on"; document.getElementById("tTax").className = "";
    document.getElementById("acctPane").hidden = false; document.getElementById("taxPane").hidden = true;
  };
  document.getElementById("tTax").onclick = function () {
    this.className = "on"; document.getElementById("tAcct").className = "";
    document.getElementById("taxPane").hidden = false; document.getElementById("acctPane").hidden = true;
    drawTax();
  };
  document.getElementById("cName").addEventListener("input", drawAcct);
  document.getElementById("tYear").addEventListener("input", drawTax);
  document.getElementById("tName").addEventListener("input", drawTax);

  fillNames();
  /* ?client=الاسم يفتح كشفه مباشرة */
  var m = location.search.match(/[?&]client=([^&]*)/);
  if (m) document.getElementById("cName").value = decodeURIComponent(m[1]);
  drawAcct();
})();
</script>
