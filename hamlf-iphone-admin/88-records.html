<script>
/* مركز واحد لكل ما أُدخل — مجمّعاً حسب مصدره، مع فتح وحذف لكل سجل */
(function () {
  "use strict";

  var openGroups = {};

  function ar(n) {
    return String(n).replace(/[0-9]/g, function (d) { return "٠١٢٣٤٥٦٧٨٩"[+d]; });
  }
  function el(t, css, txt) {
    var e = document.createElement(t);
    if (css) e.style.cssText = css;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function draw() {
    var q = document.getElementById("f").value.trim();
    var all = LawyerStore.all();
    if (q) {
      var words = LawyerStore.norm(q).split(" ").filter(Boolean);
      all = all.filter(function (r) {
        var hay = LawyerStore.norm(r.text);
        return words.every(function (w) { return hay.indexOf(w) >= 0; });
      });
    }

    /* الملخّص */
    var tot = document.getElementById("tot");
    tot.textContent = "";
    var dated = all.filter(function (r) { return r.dates.length; }).length;
    [[all.length, "سجل"], [Object.keys(LawyerStore.counts()).length, "مصدر"],
     [dated, "له تاريخ"]].forEach(function (p) {
      var d = el("div");
      d.appendChild(el("div", "", ar(p[0]))).className = "n";
      d.appendChild(el("div", "", p[1])).className = "l";
      tot.appendChild(d);
    });

    /* التجميع */
    var groups = {};
    all.forEach(function (r) { (groups[r.name] = groups[r.name] || []).push(r); });

    var box = document.getElementById("groups");
    box.textContent = "";

    var names = Object.keys(groups).sort(function (a, b) {
      return groups[b].length - groups[a].length;
    });

    if (!names.length) {
      box.appendChild(el("div",
        "text-align:center;color:var(--muted);padding:30px;font-size:14px",
        q ? "لا يوجد ما يطابق «" + q + "»"
          : "لم تُدخل أي بيانات بعد.\nابدأ من أي شاشة واضغط «حفظ»."));
      box.firstChild.style.whiteSpace = "pre-line";
      return;
    }

    names.forEach(function (name) {
      var list = groups[name];
      var g = el("div"); g.className = "grp";

      var head = document.createElement("button");
      head.type = "button";
      var isOpen = !!openGroups[name] || !!q;
      head.appendChild(el("span", "font-size:17px", isOpen ? "▾" : "▸"));
      head.appendChild(el("span", "", name)).className = "nm";
      head.appendChild(el("span", "", ar(list.length) + " سجل")).className = "ct";
      head.onclick = function () { openGroups[name] = !openGroups[name]; draw(); };
      g.appendChild(head);

      if (isOpen) {
        list.slice(0, 100).forEach(function (r) {
          var row = el("div"); row.className = "rec";
          var head2 = r.title || r.values[0] || "سجل";
          row.appendChild(el("div", "", head2)).className = "t";

          var rest = r.values.filter(function (v) { return v !== head2; })
                             .slice(0, 5).join("  ·  ");
          var meta = [];
          if (rest) meta.push(rest);
          if (r.dates.length) meta.push("📅 " + ar(r.dates[0].replace(/-/g, "/")));
          if (meta.length) row.appendChild(el("div", "", meta.join("\n"))).className = "s";
          if (row.lastChild.className === "s") row.lastChild.style.whiteSpace = "pre-line";

          var act = el("div"); act.className = "a";

          if (r.store === "screens") {
            var open = document.createElement("button");
            open.type = "button"; open.textContent = "فتح الشاشة";
            open.onclick = function () { location.href = r.screen + ".html"; };
            act.appendChild(open);
          }
          var del = document.createElement("button");
          del.type = "button"; del.textContent = "حذف";
          del.style.color = "#b3261e";
          del.onclick = function () {
            Ask.confirm("حذف هذا السجل نهائياً؟",
                        { detail: head2, ok: "حذف السجل" }, function () {
              LawyerStore.remove(r);
              draw();
            });
          };
          act.appendChild(del);
          row.appendChild(act);
          g.appendChild(row);
        });

        if (list.length > 100) {
          g.appendChild(el("div",
            "padding:11px;color:var(--muted);font-size:12.5px;text-align:center",
            "…و" + ar(list.length - 100) + " سجلاً — استخدم التصفية"));
        }
      }

      box.appendChild(g);
    });
  }

  /* ------------------------------------------- دمج المكرَّر

     الاستيراد كان يصنع من كل جلسة موعداً مستقلاً، فتكرّرت الجلسة. اللوحة
     تعرض ما سيحدث قبل تنفيذه: يُكمَّل الناقص أولاً من البيان الأوفى، ثم
     يُحذف المكرَّر — والجلسة هي التي تبقى. */

  function drawDupes() {
    var box = document.getElementById("dupBox");
    box.textContent = "";

    var p = Cleanup.preview();
    var total = p.appts.removed + p.cases.merged;
    if (!total) { box.hidden = true; return; }
    box.hidden = false;

    box.appendChild(el("div",
      "font-family:var(--f-title);font-size:15px;color:var(--brand-dark);margin-bottom:6px",
      "بيانات مكرَّرة — " + ar(total)));

    var lines = [];
    if (p.appts.removed) {
      lines.push("• " + ar(p.appts.removed) +
                 " موعداً مصنوعاً آلياً من جلسة، تظهر الجلسة بسببها مرتين.");
      if (p.appts.filledCase) {
        lines.push("   يُكمَّل من بياناتها " + ar(p.appts.filledCase) +
                   " حقلاً ناقصاً في القضايا (الدائرة · القاعة · مقرّ المحكمة · الخصوم).");
      }
      if (p.appts.filledSession) {
        lines.push("   ويُنقل منها قرار " + ar(p.appts.filledSession) + " جلسة.");
      }
      lines.push("   والتذكير ينتقل إلى الجلسة نفسها فلا يضيع.");
    }
    if (p.cases.merged) {
      lines.push("• " + ar(p.cases.merged) + " ملفاً مكرَّراً لقضايا موجودة — " +
                 "يبقى صاحب رقم الملف بالمكتب ويُكمَّل منه الناقص" +
                 (p.cases.sessions ? "، وتُضمّ " + ar(p.cases.sessions) + " جلسة" : "") + ".");
    }
    lines.forEach(function (t) {
      box.appendChild(el("div", "color:var(--muted);white-space:pre-line", t));
    });

    var go = document.createElement("button");
    go.type = "button";
    go.textContent = "دمج المكرَّر الآن";
    go.style.cssText = "width:100%;min-height:50px;margin-top:11px;border:0;" +
      "border-radius:11px;background:var(--brand);color:#fff;font-family:inherit;" +
      "font-size:15px;font-weight:600";
    go.onclick = function () {
      Ask.confirm("دمج المكرَّر الآن؟", {
        danger: false, ok: "دمج",
        detail: "يُكمَّل الناقص أولاً من البيان الأوفى، ثم يُحذف المكرَّر. " +
                "خُذ نسخة احتياطية قبلها إن أحببت."
      }, function () {
        var r = Cleanup.apply();
        alert("تم الدمج." + String.fromCharCode(10) +
              "حُذف " + ar(r.appts.removed) + " موعداً مكرَّراً، " +
              "وأُكمِل " + ar(r.appts.filledCase + r.appts.filledSession + r.cases.filled) +
              " بياناً ناقصاً.");
        drawDupes();
        draw();
      });
    };
    box.appendChild(go);
  }

  var timer;
  document.getElementById("f").addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(draw, 180);
  });

  draw();
  drawDupes();
})();
</script>
