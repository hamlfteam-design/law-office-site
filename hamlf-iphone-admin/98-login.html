<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="assets/web-store.js?v=1"></script>
<script src="assets/ios-bridges.js?v=1"></script>
<script src="assets/big-store.js?v=2"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المحامي المحترف — تسجيل الدخول</title>
<link rel="stylesheet" href="assets/app.css?v=17">
<script src="assets/drive-file-sync.js?v=2"></script>

<style>
  .login-wrap { padding:40px 20px; direction:rtl; }
  .login-logo { text-align:center; margin-bottom:6px; }
  .login-logo img { width:auto; height:110px; max-width:80%; }
  .login-title { text-align:center; font-weight:700; font-size:19px; color:#5b3a21; margin-bottom:26px; }
  .login-field { margin-bottom:14px; }
  .login-field label { display:block; font-size:13px; color:#7d7166; margin-bottom:6px; }
  .login-field input { width:100%; min-height:48px; font-family:inherit; font-size:15px;
    padding:0 12px; border:1px solid var(--line); border-radius:9px; direction:ltr; text-align:right; box-sizing:border-box; }
  .login-btn { width:100%; min-height:50px; margin-top:10px; background:#5b3a21; color:#fff;
    border:none; border-radius:10px; font-family:inherit; font-size:16px; font-weight:600; }
  .login-btn[disabled] { opacity:.6; }
  .login-err { background:#fff5f4; border:1px solid #f0cfcb; color:#8c1d18; border-radius:9px;
    padding:10px 12px; font-size:13.5px; margin-bottom:14px; line-height:1.7; display:none; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hamlf مدير">
<meta name="theme-color" content="#0f3d2e">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/pwa.css?v=1">
</head>
<body>
<div class="phone">

  <div class="appbar">
    <span></span>
    <h1>تسجيل الدخول</h1>
    <span class="screen-id">LGN</span>
  </div>

  <main>
    <div class="login-wrap">
      <div class="login-logo"><img src="assets/app-icon.png" alt="المحامي المحترف"></div>
      <div class="login-title">المحامي المحترف</div>
      <div class="login-err" id="err"></div>

      <div id="modeTabs" style="display:flex;gap:8px;margin:0 0 16px">
        <button type="button" id="tabLogin" style="flex:1;min-height:52px;border-radius:11px;border:2px solid #5b3a21;background:#5b3a21;color:#fff;font-family:inherit;font-size:14.5px;font-weight:700;line-height:1.5">
          دخول<br><span style="font-size:11.5px;font-weight:400">عندي حساب وكلمة سر<br>(المدير · المحامون · الموظفون)</span></button>
        <button type="button" id="tabFirst" style="flex:1;min-height:52px;border-radius:11px;border:2px solid #5b3a21;background:#fff;color:#5b3a21;font-family:inherit;font-size:14.5px;font-weight:700;line-height:1.5">
          أول مرة<br><span style="font-size:11.5px;font-weight:400">محامٍ / موظف دعاه المكتب<br>ولم يفعّل حسابه بعد</span></button>
      </div>

      <div id="loginBox">
        <div class="login-field">
          <label>البريد الإلكتروني</label>
          <input id="email" type="email" autocomplete="username" placeholder="name@example.com" dir="ltr" lang="en">
        </div>
        <div class="login-field">
          <label>كلمة السر</label>
          <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" dir="ltr" lang="en">
        </div>
        <button class="login-btn" id="go">دخول</button>
        <button type="button" id="forgot" style="display:block;width:100%;margin-top:14px;background:none;border:none;color:#5b3a21;font-family:inherit;font-size:14px;font-weight:700;text-decoration:underline;cursor:pointer">نسيت كلمة السر؟ أرسل رابط إعادة تعيين لبريدي</button>
      </div>

      <input type="checkbox" id="teamCheck" hidden>

      <div id="claimBox" hidden style="margin-top:12px">
        <div style="font-size:13px;color:#7d7166;line-height:1.9;margin-bottom:10px">
          <b>لأول مرة فقط.</b> اكتب بريدك ورقم تليفونك المسجَّلين عند المكتب — لو طابقا تنشئ كلمة سر وتدخل بصلاحيات دورك.
          (لو عندك كلمة سر بالفعل، ارجع لتبويب «دخول».)
        </div>
        <div class="login-field">
          <label>البريد الإلكتروني المسجَّل</label>
          <input id="claimEmail" type="email" placeholder="name@example.com" dir="ltr" lang="en">
        </div>
        <div class="login-field">
          <label>رقم التليفون المسجَّل</label>
          <input id="claimPhone" type="tel" placeholder="201001234567" dir="ltr" lang="en" inputmode="tel">
        </div>
        <button class="login-btn" id="claimCheck" style="background:#7d6a52">تحقّق من بياناتي</button>

        <div id="claimSetPass" hidden style="margin-top:14px">
          <div class="login-field">
            <label>كلمة سر جديدة</label>
            <input id="claimPass1" type="password" dir="ltr" lang="en" placeholder="••••••••">
          </div>
          <div class="login-field">
            <label>تأكيد كلمة السر</label>
            <input id="claimPass2" type="password" dir="ltr" lang="en" placeholder="••••••••">
          </div>
          <button class="login-btn" id="claimSave">إنشاء الحساب والدخول</button>
        </div>
      </div>
    </div>
  </main>

</div>

<script src="assets/norm.js?v=2"></script>
<script src="assets/firebase-config.js?v=4"></script>
<script src="assets/auth.js?v=3"></script>
<script>
(function () {
  "use strict";
  var w = window;
  var errBox = document.getElementById("err");
  var btn = document.getElementById("go");
  var emailInp = document.getElementById("email");
  var passInp = document.getElementById("pass");

  function showErr(msg) { errBox.textContent = msg; errBox.style.display = "block"; }
  function hideErr() { errBox.style.display = "none"; }

  /* أرقام عربية-هندية في البريد أو كلمة السر تمنع تسجيل الدخول تماماً —
     مفتاحيان يتوقّع عليهما كل شيء. تصحيح فوري أثناء الكتابة + عند الضغط
     على دخول، بلا اعتماد على lang="en" وحده. راجع
     [[feedback_arabic_numerals_email_exception]]. */
  function laDigits(t) {
    var fa = "۰۱۲۳۴۵۶۷۸۹";
    return String(t == null ? "" : t)
      .replace(/[٠-٩۰-۹]/g, function (d) {
        var code = d.charCodeAt(0);
        if (code >= 0x0660 && code <= 0x0669) return String(code - 0x0660);
        var fi = fa.indexOf(d);
        return fi >= 0 ? String(fi) : d;
      });
  }
  function wireLiveDigitFix(inp) {
    inp.addEventListener("input", function () {
      var v = inp.value;
      if (!/[٠-٩۰-۹]/.test(v)) return;
      var pos = inp.selectionStart;
      inp.value = laDigits(v);
      try { inp.setSelectionRange(pos, pos); } catch (e) { }
    });
  }
  wireLiveDigitFix(emailInp);
  wireLiveDigitFix(passInp);

  function mapError(code) {
    switch (code) {
      case "auth/invalid-email": return "صيغة البريد الإلكتروني غير صحيحة.";
      case "auth/user-not-found":
      case "auth/wrong-password":
      case "auth/invalid-credential": return "البريد أو كلمة السر غير صحيحة.";
      case "auth/too-many-requests": return "محاولات كثيرة، حاول بعد قليل.";
      case "auth/network-request-failed": return "تحقق من اتصال الإنترنت.";
      default: return "تعذّر تسجيل الدخول، حاول مرة أخرى.";
    }
  }

  // لو المستخدم داخل بالفعل، انتقل مباشرة للرئيسية
  if (window.Auth) {
    Auth.whenKnown(function (user) { if (user) location.replace("home.html"); });
  }

  btn.onclick = function () {
    hideErr();
    var email = laDigits(emailInp.value.trim());
    var pass = laDigits(passInp.value);
    if (!email || !pass) { showErr("من فضلك أدخل البريد وكلمة السر."); return; }
    btn.disabled = true; btn.textContent = "جارٍ الدخول…";
    var _loginDone = false;
    setTimeout(function () {
      if (_loginDone) return; _loginDone = true;
      btn.disabled = false; btn.textContent = "دخول";
      showErr("تعذّر تسجيل الدخول — لم يصل رد خلال ٢٠ ثانية. تأكد من الاتصال بالإنترنت وحاول تاني.");
    }, 20000);
    Auth.login(email, pass, function (err, user) {
      if (_loginDone) return; _loginDone = true;
      btn.disabled = false; btn.textContent = "دخول";
      if (err) { showErr(mapError(err.code)); return; }
      location.replace("home.html");
    });
  };

  passInp.addEventListener("keydown", function (e) { if (e.key === "Enter") btn.click(); });

  /* نسيان كلمة السر: يرسل Firebase رابط إعادة التعيين لبريد صاحب الحساب نفسه. */
  var forgotBtn = document.getElementById("forgot");
  forgotBtn.onclick = function () {
    hideErr();
    var email = laDigits(emailInp.value.trim()).toLowerCase();
    if (!email || email.indexOf("@") < 0) { showErr("اكتب بريدك في خانة البريد الإلكتروني أولاً ثم اضغط هنا."); return; }
    forgotBtn.disabled = true;
    var url = "https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=" +
      encodeURIComponent(w.FIREBASE_CONFIG.apiKey);
    w.FirebaseREST.request("POST", url, { requestType: "PASSWORD_RESET", email: email }, { "X-Firebase-Locale": "ar" })
      .then(function (r) {
        forgotBtn.disabled = false;
        var msg = (r.data && r.data.error && r.data.error.message) || "";
        if (r.ok) {
          showErr("تم إرسال رابط إعادة تعيين كلمة السر إلى " + email + " — افتح بريدك (وراجع البريد المزعج)، اضغط الرابط واختر كلمة سر جديدة، ثم ارجع وادخل بها.");
        } else if (msg.indexOf("EMAIL_NOT_FOUND") >= 0) {
          showErr("مفيش حساب بهذا البريد. لو أول مرة، استخدم تبويب «أول مرة».");
        } else if (msg.indexOf("TOO_MANY_ATTEMPTS") >= 0) {
          showErr("محاولات كتير — استنى شوية وحاول تاني.");
        } else {
          showErr("تعذّر إرسال الرابط" + (msg ? " — " + msg : "") + ".");
        }
      })
      .catch(function () { forgotBtn.disabled = false; showErr("تعذّر الاتصال — تحقق من الإنترنت وحاول تاني."); });
  };

  /* ------------------------------------------- أول دخول لعضو فريق جديد

     المدير بيسجّل اسم/إيميل/تليفون/دور العضو مقدَّماً (80-team.html) بلا
     كلمة سر — بيتحفظ في invites/{email} (الدور) وinviteSecrets/{email} (سرّ التليفون). الدعوة
     لا تُقرأ إلا بحساب صاحب الإيميل نفسه (لا قراءة عامة)، فهنا العضو بيكتب بريده وتليفونه
     وكلمة سر، وننشئ حسابه ونقرأ دعوته بحسابه ونسجّل دوره، والسيرفر يتحقق من التليفون والدور، بنفس أسلوب "أول مرة تدخل البوابة" في بوابة الموكلين. */
  function projectUrl() {
    return "https://firestore.googleapis.com/v1/projects/" +
      (w.FIREBASE_CONFIG && w.FIREBASE_CONFIG.projectId) + "/databases/(default)/documents";
  }
  function inviteUrl(email) {
    return projectUrl() + "/invites/" + encodeURIComponent(email);
  }
  function fsStr(doc, k) {
    var f = (doc && doc.fields) || {};
    return (f[k] && f[k].stringValue) || "";
  }

  var teamCheck = document.getElementById("teamCheck");
  var claimBox = document.getElementById("claimBox");
  var claimEmail = document.getElementById("claimEmail");
  var claimPhone = document.getElementById("claimPhone");
  var claimCheck = document.getElementById("claimCheck");
  var claimSetPass = document.getElementById("claimSetPass");
  var claimPass1 = document.getElementById("claimPass1");
  var claimPass2 = document.getElementById("claimPass2");
  var claimSave = document.getElementById("claimSave");
  var _pending = null;   // {name, email, phone, role, officeId}

  var loginBox = document.getElementById("loginBox"), tabLogin = document.getElementById("tabLogin"), tabFirst = document.getElementById("tabFirst");
  function setMode(first) {
    teamCheck.checked = !!first;
    claimBox.hidden = !first; loginBox.hidden = !!first;
    tabLogin.style.background = first ? "#fff" : "#5b3a21"; tabLogin.style.color = first ? "#5b3a21" : "#fff";
    tabFirst.style.background = first ? "#5b3a21" : "#fff"; tabFirst.style.color = first ? "#fff" : "#5b3a21";
    hideErr();
    if (first) claimEmail.focus(); else emailInp.focus();
  }
  tabLogin.onclick = function () { setMode(false); };
  tabFirst.onclick = function () { setMode(true); };
  teamCheck.onchange = function () { setMode(teamCheck.checked); };
  /* فتح من «كود ربط الجهاز» (hamlf://join في شاشة الفريق): البريد والتليفون جايين
     في الرابط — التحقق نفسه بيتم مع السحابة زي الإدخال اليدوي بالظبط */
  (function () {
    var q = new URLSearchParams(location.search);
    if (!q.get("join")) return;
    setMode(true);
    if (q.get("e")) claimEmail.value = q.get("e");
    if (q.get("p")) claimPhone.value = q.get("p");
    if (claimEmail.value && claimPhone.value) setTimeout(function () { claimCheck.click(); }, 300);
  })();

  /* يقارن الأرقام فقط (بلا مسافات/شرطات/كود دولة زيادة أو ناقص) حتى لا
     يُرفَض رقم صحيح لمجرد اختلاف صيغة كتابته بين المكتب والمحامي. */
  function phoneDigits(v) { return laDigits(String(v || "")).replace(/[^0-9]/g, ""); }
  function samePhone(a, b) {
    a = phoneDigits(a); b = phoneDigits(b);
    if (!a || !b) return false;
    return a === b || a.slice(-9) === b.slice(-9);   // آخر ٩ أرقام كافية لتجاهل كود الدولة
  }

  /* مفتاح التليفون = آخر ٩ أرقام (بعد تحويل الأرقام العربية). نفس الدالة في 80-team.html. */
  function phoneKeyOf(v) { var d = phoneDigits(v); return d.length > 9 ? d.slice(-9) : d; }

  /* الدعوة (invites/{email}) لم تعد عامة القراءة — لا تُقرأ إلا بعد تسجيل الدخول بنفس الإيميل.
     فالتحقق الحقيقي بيحصل في الخطوة التالية: السيرفر نفسه يقارن تليفونك بسرّ الدعوة. هنا فحص شكلي فقط. */
  claimCheck.onclick = function () {
    hideErr();
    var email = laDigits(claimEmail.value.trim()).toLowerCase();
    var phone = claimPhone.value.trim();
    if (!email || email.indexOf("@") < 0) { showErr("اكتب بريداً إلكترونياً صحيحاً."); return; }
    if (phoneKeyOf(phone).length < 7) { showErr("اكتب رقم تليفونك المسجَّل عند المكتب."); return; }
    _pending = { email: email, phone: phone, phoneKey: phoneKeyOf(phone) };
    var hi = document.getElementById("claimWho");
    if (!hi) {
      hi = document.createElement("div"); hi.id = "claimWho";
      hi.style.cssText = "margin:12px 0;padding:11px 14px;border-radius:10px;background:#eaf5ec;border:1px solid #b9dcc0;color:#1e5b33;font-weight:700;line-height:1.9";
      claimSetPass.parentNode.insertBefore(hi, claimSetPass);
    }
    hi.textContent = "اختر كلمة سر — وبعدها نتأكد من الدعوة ونفعّل دورك المحدَّد من المكتب.";
    claimSetPass.hidden = false;
    claimPass1.focus();
  };

  var ROLE_CACHE = "proflawyer.cloudrole.v1", CLAIM_KEY = "proflawyer.claim.v1";
  claimSave.onclick = function () {
    hideErr();
    if (!_pending) return;
    var p1 = laDigits(claimPass1.value), p2 = laDigits(claimPass2.value);
    if (!p1 || p1.length < 6) { showErr("كلمة السر 6 أحرف على الأقل."); return; }
    if (p1 !== p2) { showErr("كلمتا السر غير متطابقتين."); return; }
    claimSave.disabled = true; claimSave.textContent = "جارٍ إنشاء الحساب…";

    var apiKey = encodeURIComponent(w.FIREBASE_CONFIG.apiKey);
    var signUpUrl = "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + apiKey;
    var authHdr = null;
    /* أي فشل بعد إنشاء الحساب: نمسح الحساب الجديد والجلسة حتى لا يبقى حساب يتيم بإيميل المكتب */
    function abort(msg) {
      var h = authHdr; authHdr = null;
      var del = h ? w.FirebaseREST.request("POST", "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=" + apiKey,
        { idToken: h.Authorization.replace("Bearer ", "") }, null).catch(function () { }) : Promise.resolve();
      return del.then(function () { try { w.Auth.logout(); } catch (e) { } throw new Error(msg); });
    }
    w.FirebaseREST.request("POST", signUpUrl,
      { email: _pending.email, password: p1, returnSecureToken: true }, null)
      .then(function (r) {
        if (!r.ok || !r.data || !r.data.localId) {
          var msg = (r.data && r.data.error && r.data.error.message) || "";
          if (msg.indexOf("EMAIL_EXISTS") >= 0) {
            /* حساب قديم بكلمة سر منسية: نبعت رابط اختيار كلمة سر جديدة تلقائياً بدل ما نوقفه.
               بعد ما يختارها يدخل من تبويب «دخول»، والبرنامج بيربطه بالمكتب من الدعوة (resolveOffice).
               مفتاح التليفون اللي كتبه بيتحفظ مؤقتاً — السيرفر هيتحقق منه عند الربط. */
            try { localStorage.setItem(CLAIM_KEY, JSON.stringify({ email: _pending.email, phoneKey: _pending.phoneKey, at: Date.now() })); } catch (e) { }
            var resetUrl = "https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=" + apiKey;
            return w.FirebaseREST.request("POST", resetUrl, { requestType: "PASSWORD_RESET", email: _pending.email },
              { "X-Firebase-Locale": "ar" }).then(function (rr) {
              throw new Error(rr && rr.ok
                ? "عندك حساب قديم بالإيميل ده بكلمة سر تانية. بعتنالك دلوقتي رابط على " + _pending.email +
                  " (شوف البريد المزعج لو مش لاقيه) — افتحه واختار كلمة سر جديدة، وبعدين ارجع لتبويب «دخول» وادخل بيها، والبرنامج هيربطك بالمكتب تلقائياً."
                : "عندك حساب بالفعل بهذا البريد بكلمة سر قديمة — ارجع لتبويب «دخول» واضغط «نسيت كلمة السر؟» لاختيار كلمة سر جديدة.");
            });
          }
          throw new Error("تعذّر إنشاء الحساب" + (msg ? " — " + msg : "") + ".");
        }
        w.Auth.adoptSession(r.data);   // جلسة هذا الحساب (بدون أي دور لحد ما السيرفر يؤكّده)
        var uid = r.data.localId;
        authHdr = { "Authorization": "Bearer " + r.data.idToken };
        /* ١) الدعوة: تُقرأ بحساب صاحب الإيميل فقط */
        return w.FirebaseREST.request("GET", inviteUrl(_pending.email), null, authHdr).then(function (ri) {
          if (!ri.ok || !ri.data || !ri.data.fields) return abort("مفيش دعوة مسجَّلة بهذا البريد — تأكد منه أو تواصل مع المكتب.");
          var inv = { name: fsStr(ri.data, "name"), role: fsStr(ri.data, "role"), officeId: fsStr(ri.data, "officeId") };
          if (!inv.officeId) return abort("الدعوة غير مكتملة (بلا مكتب محدَّد) — تواصل مع المكتب.");
          /* fail-closed: الدور لازم يكون مكتوب صراحةً في الدعوة، ولا يكون مدير/موكل */
          if (!inv.role || inv.role === "owner" || inv.role === "client" || inv.role === "none")
            return abort("الدعوة بلا دور صالح — اطلب من المكتب يعيد إرسالها.");
          var usersUrl = projectUrl() + "/offices/" + encodeURIComponent(inv.officeId) + "/users/" + encodeURIComponent(uid);
          /* ٢) مستند العضو: الدور من الدعوة نفسها، والسيرفر يتحقق من تليفونك ومن الدور */
          var body = { fields: {
            email:    { stringValue: _pending.email },
            name:     { stringValue: inv.name },
            phone:    { stringValue: _pending.phone },
            phoneKey: { stringValue: _pending.phoneKey },
            role:     { stringValue: inv.role },
            active:   { booleanValue: true }
          } };
          return w.FirebaseREST.request("PATCH", usersUrl, body, authHdr).then(function (r2) {
            if (!r2.ok) {
              return abort(r2.status === 403
                ? "رقم التليفون لا يطابق ما هو مسجَّل عند المكتب لهذا البريد — تأكد منه أو تواصل مع المكتب."
                : "تعذّر ربط حسابك بصلاحيات المكتب (خطأ " + r2.status + ") — حاول تاني أو كلّم المكتب.");
            }
            /* ٣) العضوية (memberships/{uid}) — منها التطبيق بيعرف مكتب المستخدم */
            return w.FirebaseREST.request("PATCH", projectUrl() + "/memberships/" + encodeURIComponent(uid),
              { fields: { officeId: { stringValue: inv.officeId } } }, authHdr).then(function (r3) {
              if (r3 && !r3.ok) throw new Error("اتعمل الحساب واتسجّل في الفريق، لكن تعذّر ربط العضوية (خطأ " + r3.status + ") — كلّم المكتب.");
              /* ٤) الدعوة اتستُهلكت: نحذفها كي لا تُستعمل تاني (مثلاً بعد حذف العضو نهائياً) */
              return w.FirebaseREST.request("DELETE", inviteUrl(_pending.email), null, authHdr).catch(function () { });
            }).then(function () {
              /* ٥) الدور المؤكَّد يُحفظ فوراً لجلسة هذا الجهاز — team.js يقرأه (وبعدها يتأكد من السيرفر) */
              try {
                localStorage.setItem(ROLE_CACHE, JSON.stringify({ uid: uid, email: _pending.email, name: inv.name,
                  role: inv.role, roles: null, at: Date.now() }));
                localStorage.removeItem(CLAIM_KEY);
              } catch (e) { }
            });
          });
        });
      })
      .then(function () { location.replace("home.html"); })
      .catch(function (e) {
        claimSave.disabled = false; claimSave.textContent = "إنشاء الحساب والدخول";
        showErr(e && e.message ? e.message : "حصل خطأ غير متوقَّع.");
      });
  };
})();
</script>
