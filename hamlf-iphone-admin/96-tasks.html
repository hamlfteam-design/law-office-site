  .filters{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px; }

  .kanban{ display:flex; gap:9px; overflow-x:auto; padding-bottom:8px; }
  .kcol{ flex:0 0 240px; background:var(--bg,#f4ece0); border-radius:12px; padding:9px; }
  .kcol > h3{ margin:0 0 8px; font-size:14px; text-align:center; font-family:var(--f-title); }
  .crt{ background:var(--bg,#f4ece0); border-radius:12px; padding:10px; margin-bottom:12px; }
  .crt > h3{ margin:0 0 4px; font-size:15px; font-family:var(--f-title); color:var(--brand-dark); }
  .crt > .nx{ font-size:12.5px; color:var(--muted); margin-bottom:8px; line-height:1.8; }

<script>
(function () {
  "use strict";
  var CF = window.CaseFile;
  var ar = (CF && CF.ar) || function (x) { return String(x == null ? "" : x); };
  var norm = (CF && CF.norm) || function (x) { return String(x || "").toLowerCase(); };
  var view = "inbox";

  var PRIO = { "عاجل": "#b3261e", "عالي": "#e07b1a", "عادي": "#3d6cc4", "منخفض": "#8a7a63" };
  var STATE = { "تم": "#1c8a4a", "قيد التنفيذ": "#e07b1a", "ملغي": "#8a7a63", "لم يتم": "#b3792a" };
  var COLS = ["لم يتم", "قيد التنفيذ", "تم", "ملغي"];

  function el(t, css, txt) {
    var e = document.createElement(t);
    if (css) e.style.cssText = css;
    if (txt != null) e.textContent = txt;
    return e;
  }
  function me() {
    try { return (window.Team && Team.current && Team.current()) || {}; } catch (e) { return {}; }
  }
  function names() {
    var m = {};
    try { (Team.data.users || []).forEach(function (u) { m[u.id] = u.name; }); } catch (e) {}
    return m;
  }
  function cases() {
    var l = ((CF && CF.all && CF.all()) || []).slice();
    if (CF && CF.generalBox) l.push(CF.generalBox());   /* التكليفات العامة تظهر مع الباقي */
    return l;
  }

  /* يجمع كل الأعمال مع سياق قضيتها */
  function collect() {
    var out = [];
    cases().forEach(function (c) {
      (c.adminTasks || []).forEach(function (t, idx) {
        out.push({ c: c, t: t, idx: idx });
      });
    });
    return out;
  }

  function passFilters(it) {
    var court = document.getElementById("fCourt").value.trim();
    var client = document.getElementById("fClient").value.trim();
    var fDayEl = document.getElementById("fDay");
    var day = (fDayEl.dataset && fDayEl.dataset.dateKind && window.lawyerISO)
      ? (window.lawyerISO(fDayEl) || "") : fDayEl.value;
    var tc = (CF && CF.taskCourt) ? CF.taskCourt(it.c, it.t) : (it.c.courtName || "");
    if (court && norm(tc).indexOf(norm(court)) < 0) return false;
    if (client && norm(it.c.clients || "").indexOf(norm(client)) < 0) return false;
    if (day && String(it.t.taskDate || "") !== day) return false;
    return true;
  }

  function isMine(t) {
    var u = me();
    var open = t.state !== "تم" && t.state !== "ملغي";
    if (!open) return false;
    if (u.id && (t.assignees || []).indexOf(u.id) >= 0) return true;
    if (u.name && (t.watch || []).some(function (w) { return norm(w) === norm(u.name); })) return true;
    return false;
  }

  function card(it) {
    var nm = names();
    var t = it.t, c = it.c;
    var r = el("div"); r.className = "tk";
    r.appendChild(el("div", "", c.general ? "عمل إداري عام (لا يتعلق بقضية)" :
      "دعوى " + ar(c.caseNo || "—") +
      (c.caseYear ? "/" + ar(c.caseYear) : "") + (c.courtName ? " · " + c.courtName : "")))
      .className = "cx";
    var bd = el("div"); bd.className = "bd";
    if (t.prio) bd.appendChild(el("span", "background:" + (PRIO[t.prio] || "#8a7a63"), t.prio));
    bd.appendChild(el("span", "background:" + (STATE[t.state] || "#b3792a"), t.state || "لم يتم"));
    r.appendChild(bd);
    r.appendChild(el("div", "", t.text || "(بلا وصف)")).className = "wk";
    var meta = [];
    if ((t.assignees || []).length) meta.push("المُكلَّفون: " +
      t.assignees.map(function (id) { return nm[id] || "؟"; }).join("، "));
    if (t.court && t.court !== c.courtName) meta.push("المحكمة: " + t.court);
    if (t.taskDate) meta.push("العمل: " + ar(String(t.taskDate).replace(/-/g, "/")));
    if (t.dueDate) meta.push("التسليم: " + ar(String(t.dueDate).replace(/-/g, "/")));
    var subs = t.subs || [];
    if (subs.length) meta.push("فرعية: " + ar(subs.filter(function (s) { return s.done; }).length) +
      "/" + ar(subs.length));
    if (meta.length) r.appendChild(el("div", "", meta.join(" · "))).className = "mt";
    if (CF && CF.taskQuickActions) r.appendChild(CF.taskQuickActions(c, t, it.idx, draw));
    r.onclick = function () {
      if (CF && CF.editAdminTask) CF.editAdminTask(c.id, it.idx, draw);
      else if (CF && CF.openCase) CF.openCase(c.id, draw);
    };
    return r;
  }

  function draw() {
    var body = document.getElementById("body");
    var stat = document.getElementById("stat");
    body.textContent = "";
    var all = collect().filter(passFilters);

    /* عدّاد تكليفاتي */
    var mineCount = collect().filter(function (it) { return isMine(it.t); }).length;
    document.getElementById("inboxN").textContent = mineCount ? "(" + ar(mineCount) + ")" : "";

    if (view === "inbox") {
      var mine = all.filter(function (it) { return isMine(it.t); });
      stat.textContent = mine.length ? "تكليفاتي المفتوحة: " + ar(mine.length)
        : "لا تكليفات مفتوحة موجَّهة إليك.";
      mine.forEach(function (it) { body.appendChild(card(it)); });
      return;
    }
    if (view === "table") {
      stat.textContent = all.length ? "المعروض: " + ar(all.length) + " عمل" : "لا أعمال مطابقة.";
      all.forEach(function (it) { body.appendChild(card(it)); });
      return;
    }
    if (view === "court") {
      /* طلب المستخدم ٦-١٠: الأعمال المفتوحة متجمّعة تحت أقرب جلسة في كل محكمة —
         اللي رايح يحضر الجلسة ياخد الإداريات معاه */
      var open = all.filter(function (it) { var st = it.t.state || "لم يتم"; return st !== "تم" && st !== "ملغي"; });
      var groups = {}, order = [];
      open.forEach(function (it) {
        var court = (CF && CF.taskCourt) ? CF.taskCourt(it.c, it.t) : (it.c.courtName || "");
        var k = court ? ((CF && CF.courtKeyT) ? CF.courtKeyT(court) : norm(court)) : "";
        if (!groups[k]) { groups[k] = { court: court, items: [] }; order.push(k); }
        groups[k].items.push(it);
      });
      var t0 = new Date(), today = t0.getFullYear() + "-" + ("0" + (t0.getMonth() + 1)).slice(-2) + "-" + ("0" + t0.getDate()).slice(-2);
      order.forEach(function (k) { var g = groups[k]; g.nd = (k && CF && CF.nextCourtDay) ? CF.nextCourtDay(g.court, today) : null; });
      order.sort(function (a, b) {
        var da = (groups[a].nd || {}).date || "9999", db = (groups[b].nd || {}).date || "9999";
        return da < db ? -1 : da > db ? 1 : 0;
      });
      stat.textContent = open.length ? "أعمال مفتوحة: " + ar(open.length) + " في " + ar(order.length) + " محكمة — مرتّبة بأقرب جلسة"
        : "لا أعمال مفتوحة مطابقة.";
      order.forEach(function (k) {
        var g = groups[k], box = el("div"); box.className = "crt";
        box.appendChild(el("h3", "", g.court || "من غير محكمة"));
        box.appendChild(el("div", "", g.nd && CF.courtDayText ? CF.courtDayText(g.nd)
          : (g.court ? "مفيش جلسة جاية مسجّلة في المحكمة دي — حدّد التاريخ بنفسك." : "حدّد المحكمة في العمل علشان يتربط بجلساتها."))).className = "nx";
        g.items.sort(function (a, b) { return String(a.t.taskDate || "9999") < String(b.t.taskDate || "9999") ? -1 : 1; })
          .forEach(function (it) { box.appendChild(card(it)); });
        body.appendChild(box);
      });
      return;
    }
    /* board */
    stat.textContent = "بورد الحالات — " + ar(all.length) + " عمل";
    var kb = el("div"); kb.className = "kanban";
    COLS.forEach(function (col) {
      var kc = el("div"); kc.className = "kcol";
      var items = all.filter(function (it) { return (it.t.state || "لم يتم") === col; });
      kc.appendChild(el("h3", "", col + " (" + ar(items.length) + ")"));
      items.forEach(function (it) { kc.appendChild(card(it)); });
      kb.appendChild(kc);
    });
    body.appendChild(kb);
  }

  function setView(v, btnId) {
    view = v;
    ["vInbox", "vTable", "vBoard", "vCourt"].forEach(function (id) {
      document.getElementById(id).className = id === btnId ? "on" : "";
    });
    draw();
  }
  document.getElementById("vInbox").onclick = function () { setView("inbox", "vInbox"); };
  document.getElementById("vTable").onclick = function () { setView("table", "vTable"); };
  document.getElementById("vBoard").onclick = function () { setView("board", "vBoard"); };
  document.getElementById("vCourt").onclick = function () { setView("court", "vCourt"); };
  ["fCourt", "fClient", "fDay"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", draw);
  });

  document.getElementById("addGeneral").onclick = function () {
    if (CF && CF.editAdminTask) CF.editAdminTask(CF.GENERAL_ID, -1, draw);
  };

  draw();
})();
</script>
