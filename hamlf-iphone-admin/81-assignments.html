<script>
(function () {
  "use strict";
  var T = Team.data;
  var STATES = ["جديد", "قيد التنفيذ", "تم"];

  function byId(id) { return document.getElementById(id); }
  function userById(id) {
    var f = T.users.filter(function (u) { return u.id === id; });
    return f[0] || null;
  }

  /* المكلَّف: كل الأعضاء ما عدا المستخدم الحالي، ومعهم "نفسي" */
  function fillTo() {
    var sel = byId("to"), me = Team.current();
    sel.innerHTML = "";
    T.users.forEach(function (u) {
      var o = document.createElement("option");
      o.value = u.id;
      o.textContent = u.name + (u.id === me.id ? " (أنا)" : "") +
                      " — " + ((T.roles[u.role] || {}).name || u.role);
      sel.appendChild(o);
    });
  }

  byId("save").onclick = function () {
    var subj = byId("subject").value.trim();
    if (!subj) { alert("اكتب موضوع التكليف."); byId("subject").focus(); return; }

    T.assignments.unshift({
      id:      "a" + Date.now(),
      to:      byId("to").value,
      from:    Team.current().id,
      subject: subj,
      file:    byId("file").value.trim(),
      due:     byId("due").value,
      prio:    byId("prio").value,
      body:    byId("body").value.trim(),
      state:   "جديد",
      at:      new Date().toISOString()
    });
    if (!Team.save()) { alert("تعذّر الحفظ — المساحة ممتلئة."); return; }

    byId("subject").value = ""; byId("file").value = "";
    byId("due").value = "";     byId("body").value = "";
    draw();
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  };

  function text(a) {
    var to = userById(a.to), from = userById(a.from);
    var L = ["*تكليف — مؤسسة المستشار حسن عبد المنعم*", ""];
    L.push("إلى: " + (to ? to.name : "—"));
    L.push("من: "  + (from ? from.name : "—"));
    L.push("الموضوع: " + a.subject);
    if (a.file) L.push("الملف: " + a.file);
    if (a.due)  L.push("الموعد النهائي: " + a.due);
    L.push("الأولوية: " + a.prio);
    if (a.body) { L.push(""); L.push(a.body); }
    return L.join("\n");
  }

  function sendWhats(a) {
    var u = userById(a.to);
    if (!u || !u.phone) {
      alert("لا يوجد رقم واتساب لهذا العضو.\nأضفه من شاشة «المحامون والصلاحيات».");
      return;
    }
    location.href = "https://wa.me/" + u.phone.replace(/[^0-9]/g, "") +
                    "?text=" + encodeURIComponent(text(a));
  }

  function sendMail(a) {
    var u = userById(a.to);
    if (!u || !u.email) {
      alert("لا يوجد بريد إلكتروني لهذا العضو.\nأضفه من شاشة «المحامون والصلاحيات».");
      return;
    }
    location.href = "mailto:" + encodeURIComponent(u.email) +
      "?subject=" + encodeURIComponent("تكليف: " + a.subject) +
      "&body="    + encodeURIComponent(text(a));
  }

  /* أي نص جاي من بيانات (مستوردة أو متزامنة) بيتهرّب قبل ما يدخل HTML (F-AGN-3) */
  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  /* PDF: يفتح حوار الطباعة في أندرويد حيث يوجد خيار «حفظ بصيغة PDF» */
  function asPdf(a) {
    var to = userById(a.to), from = userById(a.from);
    var w = document.createElement("div");
    w.id = "__print";
    w.style.cssText = "padding:28px;direction:rtl;font-family:inherit;line-height:2";
    w.innerHTML =
      '<h2 style="margin:0 0 4px">تكليف</h2>' +
      '<div style="color:#7d7166;margin-bottom:18px">مؤسسة المستشار حسن عبد المنعم</div>' +
      '<table style="width:100%;border-collapse:collapse;font-size:15px">' +
      row("إلى", to ? to.name : "—") +
      row("من", from ? from.name : "—") +
      row("الموضوع", a.subject) +
      (a.file ? row("الملف", a.file) : "") +
      (a.due ? row("الموعد النهائي", a.due) : "") +
      row("الأولوية", a.prio) +
      row("الحالة", a.state) +
      '</table>' +
      (a.body ? '<div style="margin-top:20px;white-space:pre-wrap">' + esc(a.body) + '</div>' : '');

    function row(k, v) {
      return '<tr><td style="padding:7px 0;color:#7d7166;width:130px;vertical-align:top">' +
             esc(k) + '</td><td style="padding:7px 0">' + esc(v) + '</td></tr>';
    }

    var keep = document.body.innerHTML;
    document.body.innerHTML = "";
    document.body.appendChild(w);

    if (typeof AndroidSaver !== "undefined" && AndroidSaver.printPage) {
      AndroidSaver.printPage("تكليف-" + a.subject.slice(0, 24));
      setTimeout(function () { document.body.innerHTML = keep; draw(); }, 1400);
    } else {
      window.print();
      setTimeout(function () { document.body.innerHTML = keep; draw(); }, 700);
    }
  }

  function draw() {
    var box = byId("list");
    box.innerHTML = "";
    var me = Team.current();

    // مدير المكتب يرى الكل؛ غيره يرى ما كلّفه أو ما كُلّف به
    var mine = T.assignments.filter(function (a) {
      return Team.can("team") || a.to === me.id || a.from === me.id;
    });

    if (!mine.length) {
      box.innerHTML = '<div style="text-align:center;color:#7d7166;padding:26px;' +
                      'font-size:14px">لا توجد تكليفات بعد.</div>';
      return;
    }

    var today = new Date().toISOString().slice(0, 10);

    mine.forEach(function (a) {
      var to = userById(a.to), from = userById(a.from);
      var late = a.due && a.due < today && a.state !== "تم";

      var c = document.createElement("div");
      c.className = "a-card p-" + a.prio;
      c.innerHTML =
        '<div class="a-top"><span class="a-ttl">' + esc(a.subject) + '</span>' +
        '<span class="chip s-' + esc(String(a.state || "").replace(/ /g, "-")) + '">' + esc(a.state) + '</span></div>' +
        '<div class="a-sub">' +
          "إلى: " + esc(to ? to.name : "—") + " · من: " + esc(from ? from.name : "—") +
          (a.file ? "<br>الملف: " + esc(a.file) : "") +
          (a.due ? '<br><span class="' + (late ? "late" : "") + '">الموعد: ' + esc(a.due) +
                   (late ? " — متأخر" : "") + '</span>' : "") +
        '</div>';

      var act = document.createElement("div");
      act.className = "a-act";

      [["واتساب", function () { sendWhats(a); }],
       ["إيميل",  function () { sendMail(a); }],
       ["PDF",    function () { asPdf(a); }],
       ["الحالة", function () {
          a.state = STATES[(STATES.indexOf(a.state) + 1) % STATES.length];
          Team.save(); draw();
        }],
       ["حذف", function () {
          if (!confirm("حذف هذا التكليف؟")) return;
          T.assignments = T.assignments.filter(function (x) { return x.id !== a.id; });
          Team.save(); draw();
        }]].forEach(function (p) {
        var b = document.createElement("button");
        b.type = "button"; b.textContent = p[0]; b.onclick = p[1];
        if (p[0] === "حذف") b.style.color = "#b3261e";
        act.appendChild(b);
      });

      c.appendChild(act);
      box.appendChild(c);
    });
  }

  fillTo();
  draw();
})();
</script>
